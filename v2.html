function makeSprite(rows, scale = 2) {
  const c = document.createElement("canvas");
  c.width = rows[0].length * scale;
  c.height = rows.length * scale;
  const g = c.getContext("2d");
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const col = PAL[row[x]];
      if (col) { g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
    }
  });
  return c;
}

const SND = {
  ctx: null,
  muted: localStorage.getItem(LS.muted) === "1",
  bgmTimer: null, bgmStep: 0,
  ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type = "square", vol = 0.06, when = 0, slide = 0) {
    if (this.muted) return;
    const a = this.ensure(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    const t = a.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur);
  },
  jump()  { this.tone(300, 0.15, "square", 0.05, 0, 300); },
  djump() { this.tone(420, 0.13, "square", 0.05, 0, 320); },
  wing()  { [523, 784, 1047].forEach((f, i) => this.tone(f, 0.09, "triangle", 0.06, i * 0.05)); },

  bad()   { this.tone(220, 0.18, "sawtooth", 0.07, 0, -80); },

  WK_MEL: [392, 0, 0, 440, 0, 0, 523, 0, 494, 0, 0, 440, 0, 0, 392, 0],
  startBgm() {
    if (this.bgmTimer) return;
    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (this.muted) return;
      if (state === "play") {
        const m = this.MELODY[this.bgmStep % 16];
        const b = this.BASS[this.bgmStep % 16];
        if (m) this.tone(m, 0.11, "square", 0.022);
        if (b) this.tone(b, 0.13, "triangle", 0.05);
        this.bgmStep++;
      } else if (state === "weekend") {
        const m = this.WK_MEL[this.bgmStep % 16];
        if (m) this.tone(m, 0.22, "triangle", 0.05);
        this.bgmStep++;
      }
    }, 140);
  },
  stopBgm() { clearInterval(this.bgmTimer); this.bgmTimer = null; },
  toggle() {

let day, week, mult, hearts, coffee, score, payCount, flashT, dayMsgT, shakeT;
let quip = null, boostT = 0, wingsT = 0, slowT = 0, overtimeOn = false, overMsg = "";
let combo = 0, comboT = 0, maxCombo = 0, nearMiss = 0, runCoffee = 0, runBoost = 0;
let bonusT = 0, eventT = 10, rushN = 0, rushT = 0, rushType = "kakao";
let ceoT = 0, ceoHit = false;
let rushAnnounced = false, dayRushHit = false, daySawRush = false;
let wage = MIN_WAGE, metaRankIdx = 0;
let wk = null, wkResultT = 0;
let tutT = 0;
let promoted = false, promoRank = null;
let lastTime = 0, animT = 0;

function pf() { return ceoT > 0 ? 2 : 1; }  // 사장님 시찰: 점수 2배
function gain(amount) { return Math.floor(amount * mult * pf()); }

function reset() {
  player = { x: 70, y: GROUND, vy: 0, onGround: true, jumps: 0, sliding: false, inv: 0 };
  obstacles = []; items = []; particles = []; floats = [];
  spawnT = 1.5; itemT = 1.8;
  dist = 0; speed = 190;
  day = 0; week = 0; mult = 1; hearts = 3; coffee = 0; payCount = 0; score = 0;
  flashT = 0; dayMsgT = 1.6; shakeT = 0;
  quip = null; boostT = 0; wingsT = 0; slowT = 0; overtimeOn = false;
  combo = 0; comboT = 0; maxCombo = 0; nearMiss = 0; runCoffee = 0; runBoost = 0;
  bonusT = 0; eventT = 10; rushN = 0; rushT = 0; ceoT = 0; ceoHit = false;
  rushAnnounced = false; dayRushHit = false; daySawRush = false;
  metaRankIdx = rankFor(Number(localStorage.getItem(LS.total) || 0));
  wage = Math.round(MIN_WAGE * RANKS[metaRankIdx].wage);
  wk = null; promoted = false; promoRank = null;
  say(QUIP.dayStart[0]);
}
function say(txt, dur = 1.6) { quip = { txt, t: dur }; }
function addFloat(x, y, txt, col = "#ffd166") {
  floats.push({ x, y, txt, col, t: 0, life: 1.1 });
}
function clockStr() {
  // 09:00 출근 → 18:00 퇴근 (점심 포함 9시간 = 근무 8시간)
  const prog = (dist % DAY_LEN) / DAY_LEN;
  const mins = Math.floor(9 * 60 + prog * 9 * 60);
  const h = Math.floor(mins / 60), m = mins % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

/* ── 입력 ────────────────────────────────────────────────── */
const keys = {};
function doJump() {
  if (state === "title" || state === "over") { startGame(); return; }
  if (state !== "play") return;
  const maxJumps = wingsT > 0 ? 3 : 2;
  const power = wingsT > 0 ? -510 : -480;
  if (player.onGround) {
    player.vy = power; player.onGround = false; player.jumps = 1; SND.jump(); buzz(10);
  } else if (player.jumps < maxJumps) {
    player.vy = power + 50; player.jumps++;
    if (player.jumps >= 3) SND.wing(); else SND.djump();
    buzz(10);
    for (let i = 0; i < 6; i++) particles.push(puff(player.x, player.y));
  }
}
function setSlide(on) { if (state === "play") player.sliding = on && player.onGround; }

document.addEventListener("keydown", (e) => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; }
  if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; }
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); doJump(); }
  if (e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); keys.slide = true; setSlide(true); }
  if (e.code === "KeyP" && (state === "play" || state === "pause")) state = state === "play" ? "pause" : "play";
  if (e.code === "KeyM") SND.toggle();
  if (e.code === "Enter" && (state === "title" || state === "over")) startGame();
});
document.addEventListener("keyup", (e) => {
  if (e.code === "ArrowDown" || e.code === "KeyS") { keys.slide = false; setSlide(false); }
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

const btnJump = document.getElementById("btn-jump");
const btnSlide = document.getElementById("btn-slide");
const btnShare = document.getElementById("btn-share");
function setButtons(mode) {
  if (mode === "wk") { btnSlide.textContent = "◀ 이동"; btnJump.textContent = "이동 ▶"; }
  else { btnSlide.textContent = "⬇ 슬라이드"; btnJump.textContent = "⬆ 점프"; }
}
btnJump.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state === "weekend") keys.right = true; else doJump();
});
btnJump.addEventListener("touchend", (e) => { e.preventDefault(); keys.right = false; });
btnSlide.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state === "weekend") keys.left = true;
  else { keys.slide = true; setSlide(true); }
});
btnSlide.addEventListener("touchend", (e) => {
  e.preventDefault();
  keys.left = false; keys.slide = false; setSlide(false);
});
cvs.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (state === "weekend") {
    const r = cvs.getBoundingClientRect();
    const x = e.touches[0].clientX - r.left;
    if (x < r.width / 2) keys.left = true; else keys.right = true;
  } else doJump();
});
cvs.addEventListener("touchend", (e) => { e.preventDefault(); keys.left = false; keys.right = false; });
cvs.addEventListener("mousedown", () => { if (state === "title" || state === "over") startGame(); });
btnShare.addEventListener("click", shareResult);

function shareResult() {
  const r = RANKS[rankFor(Number(localStorage.getItem(LS.total) || 0))];
  const text =
    `🏃 직장인 러너: 출근 대작전\n` +
    `${r.emoji} ${r.name} 김대리(시급 ${wage.toLocaleString()}원), ${Math.floor(score).toLocaleString()}원 벌고 번아웃!\n` +
    `${Math.floor(dist)}m 출근 · ☕${coffee}잔 · 니어미스 ${nearMiss}회 · 최대 콤보 x${maxCombo}\n` +
    `너도 출근해 볼래? 👉 ${GAME_URL}`;
  if (navigator.share) {
    navigator.share({ title: "직장인 러너", text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      btnShare.textContent = "✅ 복사 완료!";
      setTimeout(() => { btnShare.textContent = "📤 결과 공유"; }, 2000);
    });
  }
}

function startGame() {
  reset();
  state = "play";
  setButtons("run");
  btnShare.style.display = "none";
  if (!localStorage.getItem(LS.played)) {
    tutT = 4; spawnT = 3.2;
    localStorage.setItem(LS.played, "1");
  }
  unlock("first");
  SND.ensure();
  SND.startBgm();
}

/* ── 장애물 / 아이템 ─────────────────────────────────────── */
function dayProg() { return (dist % DAY_LEN) / DAY_LEN; }
function inRushWindow() { return dayProg() > RUSH_START; }

function spawnObstacle() {
  // 퇴근 전 러시: 야근 장애물(보고서/회의 요청/업체 전화) 우선 등장
  if (inRushWindow() && Math.random() < 0.5) {
    const t = OT_TYPES[Math.floor(Math.random() * OT_TYPES.length)];
    let o;
    if (t === "report")       o = { type: "report",  w: 24, h: 36, ot: true };
    else if (t === "meeting") o = { type: "meeting", w: 30, h: 16, ot: true, flyY: GROUND - 44 - Math.random() * 40, t: 0 };
    else                      o = { type: "phone",   w: 26, h: 14, ot: true, ringT: 0 };
    o.x = W + 30;
    obstacles.push(o);
    return;
  }
  const r = Math.random();
  const kakaoOk = (day >= 1 || week > 0);
  let o;
  if (kakaoOk && r < 0.18) {
    o = { type: "kakao", w: 26, h: 14, flyY: GROUND - 34 - Math.random() * 50, t: 0 };
  }
  else if (r < 0.36) o = { type: "papers", w: 22, h: 20 };
  else if (r < 0.56) o = { type: "chair",  w: 26, h: 34 };
  else if (r < 0.72) o = { type: "boss",   w: 26, h: 40 };
  else if (r < 0.9)  o = { type: "banner", w: 30, h: 999 };
  else               o = { type: "spill",  w: 34, h: 6 };
  o.x = W + 30;
  obstacles.push(o);
}
function spawnRushProjectile() {
  if (rushType === "phone") {
    obstacles.push({ type: "phone", w: 26, h: 14, ot: true, ringT: 0, x: W + 30 });
  } else {
    obstacles.push({ type: "kakao", w: 26, h: 14, x: W + 30, flyY: GROUND - 20 - Math.random() * 70, t: 0 });
  }
}
function spawnItem() {
  const roll = Math.random();
  if (bonusT <= 0 && roll < 0.1 && payCount < Math.floor(dist / 400)) {
    items.push({ type: "pay", x: W + 20, y: GROUND - 70 - Math.random() * 40, w: 20, h: 14 });
    payCount++;
    return;
  }
  if (bonusT <= 0 && roll < 0.16) {
    items.push({ type: "energy", x: W + 20, y: GROUND - 40 - Math.random() * 50, w: 16, h: 16 });
    return;
  }
  if (bonusT <= 0 && roll < 0.22) {
    items.push({ type: "redbull", x: W + 20, y: GROUND - 50 - Math.random() * 55, w: 18, h: 16 });
    return;
  }
  if (overtimeOn && roll < 0.34) {     // 금요일 야근 중 야식 치킨
    items.push({ type: "chick", x: W + 20, y: GROUND - 30 - Math.random() * 40, w: 20, h: 16 });
    return;
  }
  const n = 3 + Math.floor(Math.random() * 3);
  const baseY = GROUND - 26 - Math.random() * 64;
  for (let i = 0; i < n; i++) {
    items.push({ type: "coffee", x: W + 20 + i * 22, y: baseY - Math.sin((i / (n - 1)) * Math.PI) * 18, w: 16, h: 14 });
  }
}
function puff(x, y) {
  return { x, y, vx: -40 - Math.random() * 60, vy: -20 - Math.random() * 50,
           life: 0.4 + Math.random() * 0.3, t: 0, col: "#9aa0b5" };
}
function sparkle(x, y, col) {
  return { x, y, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 80,
           life: 0.5, t: 0, col };
}

/* ── 충돌 ───────────────────────────────────────────────── */
function hitbox() {
  if (player.sliding) return { x: player.x - 14, y: GROUND - 14, w: 30, h: 14 };
  return { x: player.x - 9, y: player.y - 28, w: 18, h: 28 };
}
function obstacleBox(o) {
  if (o.type === "banner") return { x: o.x, y: 0, w: o.w, h: GROUND - 24 };
  if (o.type === "kakao" || o.type === "meeting") return { x: o.x, y: o.flyY, w: o.w, h: o.h };
  return { x: o.x, y: GROUND - o.h, w: o.w, h: o.h };
}
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function expand(b, m) { return { x: b.x - m, y: b.y - m, w: b.w + m * 2, h: b.h + m * 2 }; }

/* ── 러너 업데이트 ──────────────────────────────────────── */
function updateRun(dt) {
  const boost = boostT > 0 ? 120 : 0;
  speed = Math.min(540, 190 + dist * 0.045) + boost;
  if (slowT > 0) { slowT -= dt; speed *= 0.65; }       // 야근 페널티: 느려짐
  const meters = speed * dt / 10;
  dist += meters;
  // 기본 수입: 1m = 시급 × 8시간 / 500m (직급이 오르면 같은 거리도 더 번다)
  score += meters * (wage * WORK_HOURS / DAY_LEN) * mult * pf();
  if (boostT > 0) {
    boostT -= dt;
    if (Math.random() < 0.5) particles.push(sparkle(player.x - 10, player.y - 14, "#3ee06f"));
  }
  if (wingsT > 0) {
    wingsT -= dt;
    if (Math.random() < 0.4) particles.push(sparkle(player.x - 12, player.y - 20, "#4cc9f0"));
  }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  if (tutT > 0) tutT -= dt;

  const dayIdx = Math.floor(dist / DAY_LEN);
  const newDay = dayIdx % 5, newWeek = Math.floor(dayIdx / 5);
  if (newWeek > week) {
    checkNoOvertime();
    day = newDay; week = newWeek;
    mult = 1 + dayIdx * 0.15;
    if (week >= 1) unlock("week2");
    if (week >= 2) unlock("week3");
    enterWeekend();
    return;
  }
  if (newDay !== day) {
    checkNoOvertime();
    day = newDay;
    mult = 1 + dayIdx * 0.15;
    dayMsgT = 1.6; SND.day();
    say(QUIP.dayStart[day]);
  }

  // 퇴근 전 러시 안내 (매일 1회)
  if (inRushWindow()) {
    daySawRush = true;
    if (!rushAnnounced) { rushAnnounced = true; say(QUIP.rushIn, 2); SND.warn(); }
  }

  // 금요일 야근 위기 (어두워짐)
  const inOvertime = day === 4 && dayProg() > 0.5;
  if (inOvertime && !overtimeOn) { overtimeOn = true; say(QUIP.overtime, 2); SND.bad(); }
  if (!inOvertime) overtimeOn = false;

  // 랜덤 이벤트
  if (bonusT > 0) bonusT -= dt;
  if (ceoT > 0) {
    ceoT -= dt;
    if (ceoT <= 0 && !ceoHit) unlock("ceo");
  }
  if (rushN > 0) {
    rushT -= dt;
    if (rushT <= 0) { spawnRushProjectile(); rushN--; rushT = 0.55; }
  }
  eventT -= dt;
  if (eventT <= 0 && !overtimeOn && bonusT <= 0 && rushN <= 0 && ceoT <= 0 && tutT <= 0) {
    const r = Math.random();
    if (r < 0.3) {
      bonusT = 5; say(QUIP.bonusTime, 2); SND.bonus();
    } else if (r < 0.55 && (day >= 1 || week > 0)) {
      rushN = 3; rushT = 1.0; rushType = "kakao";
      say(QUIP.rush, 2); SND.warn(); shakeT = 0.2;
    } else if (r < 0.75 && (day >= 1 || week > 0)) {
      rushN = 3; rushT = 1.0; rushType = "phone";
      say(QUIP.phoneRush, 2); SND.ring(); shakeT = 0.2;
    } else {
      ceoT = 10; ceoHit = false;
      say(QUIP.ceo, 2); SND.warn();
    }
    eventT = 14 + Math.random() * 10;
  }

  // 플레이어 물리
  const wasAir = !player.onGround;
  player.vy += 1500 * dt;
  player.y += player.vy * dt;
  if (player.y >= GROUND) {
    player.y = GROUND; player.vy = 0;
    if (!player.onGround) {
      player.onGround = true; player.jumps = 0; player.sliding = keys.slide;
      if (wasAir) for (let i = 0; i < 4; i++) particles.push(puff(player.x, GROUND));
    }
  } else {
    player.onGround = false; player.sliding = false;
  }
  if (player.inv > 0) player.inv -= dt;

  // 스폰
  spawnT -= dt;
  if (spawnT <= 0) {
    if (bonusT <= 0) spawnObstacle();
    const minGap = (140 + speed * 0.45) / speed;
    let gap = minGap + Math.random() * 0.85;
    if (overtimeOn) gap *= 0.72;
    if (ceoT > 0) gap *= 0.85;
    if (dist < 200) gap *= 1.35;
    spawnT = gap;
  }
  itemT -= dt;
  if (itemT <= 0) {
    spawnItem();
    itemT = bonusT > 0 ? 0.3 : 1.6 + Math.random() * 2.2;
  }

  // 장애물 이동/충돌/니어미스
  const pb = hitbox();
  obstacles = obstacles.filter(o => {
    if (o.type === "kakao" || o.type === "meeting") {
      o.t = (o.t || 0) + dt;
      o.x -= (speed + (o.type === "kakao" ? 70 : 30)) * dt;
      o.flyY += Math.sin(o.t * (o.type === "kakao" ? 6 : 3.5)) * 18 * dt;
    } else {
      o.x -= speed * dt;
    }
    if (o.type === "phone") {
      o.ringT = (o.ringT || 0) + dt;
      if (o.ringT > 0.8) { o.ringT = 0; if (o.x < W && o.x > 0) SND.ring(); }
    }
    if (o.x + o.w < -40) return false;

    const ob = obstacleBox(o);
    if (player.inv <= 0 && boostT <= 0 && !o.hit && overlap(pb, ob)) {
      o.hit = true;
      ceoHit = true;
      if (o.ot) {
        // 야근 장애물: 하트 대신 슬로우 + 수입 차감
        slowT = 5; dayRushHit = true;
        const pen = gain(wage / 2);
        score = Math.max(0, score - pen);
        flashT = 0.15; shakeT = 0.2;
        SND.slow(); buzz(50);
        say(QUIP.otHit[Math.floor(Math.random() * QUIP.otHit.length)]);
        addFloat(player.x + 8, player.y - 46, "야근 -" + pen.toLocaleString(), "#ff9e44");
      } else {
        hearts--; player.inv = 1.5; flashT = 0.25; shakeT = 0.3;
        combo = 0; comboT = 0;
        SND.hit(); buzz(80);
        say(QUIP.hit[Math.floor(Math.random() * QUIP.hit.length)]);
        if (o.type === "kakao") addFloat(player.x, player.y - 44, "부장님: 어디야?", "#e94560");
        if (hearts <= 0) { gameOver(); return true; }
      }
    }
    if (!o.passed && !o.hit) {
      if (overlap(expand(pb, 9), ob)) o.close = true;
      if (ob.x + ob.w < pb.x) {
        o.passed = true;
        if (o.close && player.inv <= 0) {
          nearMiss++;
          const pts = gain(300);
          score += pts;
          addFloat(player.x + 12, player.y - 40, "아찔! +" + pts, "#4cc9f0");
          SND.near();
          if (Math.random() < 0.3) say(QUIP.near[Math.floor(Math.random() * QUIP.near.length)], 1);
          if (nearMiss >= 10) unlock("near10");
        }
      }
    }
    return true;
  });

  // 아이템
  items = items.filter(it => {
    it.x -= speed * dt;
    if (it.x + it.w < -20) return false;
    if (overlap(pb, it)) {
      if (it.type === "coffee") {
        coffee++; runCoffee++;
        combo++; comboT = 3;
        if (combo > maxCombo) maxCombo = combo;
        if (combo >= 10) unlock("combo10");
        const pts = gain(500 * (1 + Math.min(combo, 20) * 0.1));
        score += pts;
        if (combo >= 3) SND.combo(combo); else SND.coin();
        addFloat(it.x, it.y, "+" + pts.toLocaleString() + (combo >= 3 ? " x" + combo : ""));
        for (let i = 0; i < 5; i++) particles.push(sparkle(it.x, it.y, "#ffd166"));
        if (coffee % 10 === 0 && hearts < 3) { hearts++; SND.heart(); say(QUIP.coffee10); }
        const totalCoffee = Number(localStorage.getItem(LS.coffee) || 0) + 1;
        localStorage.setItem(LS.coffee, String(totalCoffee));
        if (totalCoffee >= 50) unlock("coffee50");
      } else if (it.type === "pay") {
        // 보너스 봉투 = 시급 1시간치... 절반은 카드값으로
        const bonusAmt = gain(wage);
        score += bonusAmt; SND.pay(); buzz([20, 30, 20]);
        say(QUIP.pay);
        addFloat(it.x, it.y, "+" + bonusAmt.toLocaleString(), "#06d6a0");
        for (let i = 0; i < 10; i++) particles.push(sparkle(it.x, it.y, "#06d6a0"));
        const cardAmt = Math.floor(bonusAmt / 2);
        setTimeout(() => {
          if (state !== "play") return;
          score = Math.max(0, score - cardAmt); SND.card();
          say(QUIP.card);
          addFloat(player.x + 10, player.y - 50, "카드값 -" + cardAmt.toLocaleString(), "#e94560");
        }, 700);
      } else if (it.type === "energy") {
        boostT = 4; runBoost++;
        if (runBoost >= 3) unlock("boost3");
        SND.boost(); buzz([15, 20, 15]);
        say(QUIP.energy);
        addFloat(it.x, it.y, "무적 질주!", "#3ee06f");
      } else if (it.type === "redbull") {
        wingsT = 6; slowT = 0;                       // 날개 + 야근 페널티 해제
        unlock("redbull");
        SND.wing(); buzz([15, 20, 15]);
        say(QUIP.redbull);
        addFloat(it.x, it.y, "3단 점프!", "#4cc9f0");
        for (let i = 0; i < 8; i++) particles.push(sparkle(it.x, it.y, "#4cc9f0"));
      } else if (it.type === "chick") {
        const pts = gain(wage / 2);
        score += pts;
        SND.coin(); say(QUIP.snack);
        addFloat(it.x, it.y, "야식 +" + pts.toLocaleString(), "#ff9e44");
      }
      return false;
    }
    return true;
  });

  if (score >= 500000) unlock("rich");
  updateFx(dt);
}

function checkNoOvertime() {
  if (daySawRush && !dayRushHit) unlock("notonight");
  daySawRush = false; dayRushHit = false; rushAnnounced = false;
}

/* ── 주말 보너스 ────────────────────────────────────────── */
function enterWeekend() {
  state = "weekend";
  setButtons("wk");
  const kal = gain(wage * 2);                        // 칼퇴 보너스 = 시급 2시간치
  score += kal;
  wk = { t: 15, score: kal, px: W / 2, items: [], spawnT: 0.3, intro: 2, kal };
  obstacles = []; items = [];
  SND.bonus(); buzz([30, 40, 30]);
  say(QUIP.escape, 2);
  unlock("kaltoe");
}

function wkTypes() {
  return [
    { type: "chicken", spr: "chicken", good: true,  pts: wage / 2,  msg: QUIP.wkChicken, w: 20, h: 16 },
    { type: "zzz",     spr: null,      good: true,  pts: wage / 4,  msg: QUIP.wkZzz,     w: 20, h: 14 },
    { type: "kakao",   spr: "kakao",   good: false, pts: -wage / 2, msg: QUIP.wkKakao,   w: 26, h: 14 },
    { type: "alarm",   spr: "alarm",   good: false, pts: -wage / 4, msg: null,           w: 20, h: 18 },
    { type: "letter",  spr: "letter",  good: false, pts: -wage / 4, msg: QUIP.wkLetter,  w: 24, h: 14 },
  ];
}

function updateWeekend(dt) {
  if (wk.intro > 0) { wk.intro -= dt; updateFx(dt); return; }
  wk.t -= dt;
  if (wk.t <= 0) {
    state = "wkresult"; wkResultT = 2.4;
    if (wk.score >= 20000) unlock("wk800");
    SND.day();
    return;
  }
  const mv = 230 * dt;
  if (keys.left) wk.px -= mv;
  if (keys.right) wk.px += mv;
  wk.px = Math.max(30, Math.min(W - 30, wk.px));

  wk.spawnT -= dt;
  if (wk.spawnT <= 0) {
    const goodRoll = Math.random() < 0.55;
    const pool = wkTypes().filter(t => t.good === goodRoll);
    const def = pool[Math.floor(Math.random() * pool.length)];
    wk.items.push({ def, x: 20 + Math.random() * (W - 40), y: -20,
                    vy: 110 + Math.random() * 90 + week * 12 });
    wk.spawnT = 0.42 + Math.random() * 0.3;
  }
  const pbox = { x: wk.px - 24, y: GROUND - 16, w: 48, h: 16 };
  wk.items = wk.items.filter(it => {
    it.y += it.vy * dt;
    if (it.y > GROUND + 10) return false;
    const box = { x: it.x - it.def.w / 2, y: it.y - it.def.h / 2, w: it.def.w, h: it.def.h };
    if (overlap(pbox, box)) {
      const pts = Math.floor(it.def.pts * mult);
      score = Math.max(0, score + pts); wk.score += pts;
      addFloat(it.x, it.y - 10, (pts > 0 ? "+" : "") + pts.toLocaleString(), it.def.good ? "#06d6a0" : "#e94560");
      if (it.def.good) {
        SND.coin();
        if (it.def.type === "zzz" && hearts < 3) { hearts++; SND.heart(); }
        for (let i = 0; i < 6; i++) particles.push(sparkle(it.x, it.y, "#ffd166"));
      } else {
        SND.bad(); shakeT = 0.25; buzz(60);
      }
      if (it.def.msg) say(it.def.msg, 1.2);
      return false;
    }
    return true;
  });
  updateFx(dt);
}

function resumeRun() {
  state = "play";
  setButtons("run");
  hearts = Math.min(3, hearts + 1);
  dayMsgT = 1.6;
  say(QUIP.monday, 2);
  SND.day();
}

/* ── 공통 이펙트 ────────────────────────────────────────── */
function updateFx(dt) {
  particles = particles.filter(p => {
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    return p.t < p.life;
  });
  floats = floats.filter(f => { f.t += dt; return f.t < f.life; });
  toasts = toasts.filter(t => { t.t += dt; return t.t < t.life; });
  if (flashT > 0) flashT -= dt;
  if (dayMsgT > 0) dayMsgT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (quip && (quip.t -= dt) <= 0) quip = null;
}

function update(dt) {
  animT += dt;
  if (state === "play") updateRun(dt);
  else if (state === "weekend") updateWeekend(dt);
  else if (state === "wkresult") {
    updateFx(dt);
    wkResultT -= dt;
    if (wkResultT <= 0) resumeRun();
  } else {
    toasts = toasts.filter(t => { t.t += dt; return t.t < t.life; });
  }
}

function gameOver() {
  state = "over";
  overMsg = OVER_MSG[Math.floor(Math.random() * OVER_MSG.length)];
  SND.stopBgm(); SND.over(); buzz([100, 50, 100, 50, 200]);
  const earned = Math.max(0, Math.floor(score));
  const best = Number(localStorage.getItem(LS.best) || 0);
  if (earned > best) localStorage.setItem(LS.best, String(earned));
  const prevTotal = Number(localStorage.getItem(LS.total) || 0);
  const prevRank = rankFor(prevTotal);
  const newTotal = prevTotal + earned;
  localStorage.setItem(LS.total, String(newTotal));
  const newRank = rankFor(newTotal);
  if (newRank > prevRank) {
    promoted = true;
    promoRank = RANKS[newRank];
    unlock("promo1");
    setTimeout(() => SND.promo(), 600);
  }
  btnShare.style.display = "block";
}

const DAY_TINT = ["#1a1d2e", "#1a2030", "#1d1a30", "#201a2e", "#241a28"];

function drawBg(weekendMode) {
  ctx.fillStyle = weekendMode ? "#241a35" : DAY_TINT[day];
  ctx.fillRect(0, 0, W, GROUND);
  const off1 = weekendMode ? 0 : -(dist * 1.2) % 170;
  for (let x = off1; x < W + 170; x += 170) {
    ctx.fillStyle = "#10121f";
    ctx.fillRect(x, 28, 90, 64);
    ctx.fillStyle = weekendMode ? "#2a1f4a" : "#0a1530";
    ctx.fillRect(x + 4, 32, 82, 56);
    ctx.fillStyle = "#ffd166";
    for (let i = 0; i < 8; i++) {
      const sx = x + 10 + ((i * 37) % 70), sy = 44 + ((i * 23) % 36);
      if ((i + Math.floor(x / 170)) % 3) ctx.fillRect(sx, sy, 3, 3);
    }
    ctx.fillStyle = "#2a2f4a";
    ctx.fillRect(x + 42, 32, 4, 56);
  }
  if (!weekendMode) {
    const off2 = -(dist * 3) % 420;
    for (let x = off2; x < W + 420; x += 420) {
      ctx.fillStyle = "#2d3250";
      ctx.fillRect(x + 230, 40, 56, 38);
      ctx.fillStyle = "#e94560";
      ctx.fillRect(x + 234, 44, 48, 10);
      ctx.fillStyle = "#9aa0b5";
      ctx.font = "8px monospace";
      ctx.fillText("야근은 셀프", x + 237, 68);
      ctx.fillStyle = "#c0c8e0";
      ctx.beginPath(); ctx.arc(x + 330, 50, 10, 0, 7); ctx.fill();
      ctx.strokeStyle = "#20223a";
      ctx.beginPath(); ctx.moveTo(x + 330, 50); ctx.lineTo(x + 330, 43); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 330, 50); ctx.lineTo(x + 335, 52); ctx.stroke();
    }
    const off3 = -(dist * 6) % 260;
    for (let x = off3; x < W + 260; x += 260) {
      ctx.fillStyle = "#171a2c";
      ctx.fillRect(x, GROUND - 56, 84, 56);
      ctx.fillRect(x + 14, GROUND - 78, 34, 24);
      ctx.fillStyle = "#243a63";
      ctx.fillRect(x + 17, GROUND - 75, 28, 18);
    }
  } else {
    ctx.fillStyle = "#f5e6a0";
    ctx.beginPath(); ctx.arc(70, 46, 12, 0, 7); ctx.fill();
    ctx.fillStyle = "#241a35";
    ctx.beginPath(); ctx.arc(75, 42, 11, 0, 7); ctx.fill();
  }
  ctx.fillStyle = weekendMode ? "#2d2348" : "#242842";
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = weekendMode ? "#241c3a" : "#1d2138";
  const off4 = weekendMode ? 0 : -(dist * 10) % 40;
  for (let x = off4; x < W + 40; x += 40) ctx.fillRect(x, GROUND, 20, H - GROUND);
  ctx.fillStyle = "#343a55";
  ctx.fillRect(0, GROUND, W, 2);
}

function drawObstacle(o) {
  const y = GROUND - o.h;
  if (o.type === "papers") {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 ? "#e8e8f0" : "#f5f5f5";
      ctx.fillRect(o.x + (i % 2) * 2 - 1, GROUND - 4 - i * 4, o.w, 4);
    }
    ctx.fillStyle = "#9aa0b5";
    ctx.fillRect(o.x + 4, GROUND - 11, o.w - 8, 1);
  } else if (o.type === "report") {
    // 긴급 보고서 탑 (높게 쌓임)
    for (let i = 0; i < 9; i++) {
      ctx.fillStyle = i % 2 ? "#e8e8f0" : "#f5f5f5";
      ctx.fillRect(o.x + ((i % 3) - 1) * 2, GROUND - 4 - i * 4, o.w, 4);
    }
    ctx.fillStyle = "#e94560";
    ctx.fillRect(o.x + 2, y + 2, 20, 9);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px monospace";
    ctx.fillText("긴급", o.x + 4, y + 10);
  } else if (o.type === "meeting") {
    ctx.drawImage(SPR.meeting, o.x, o.flyY);
    ctx.fillStyle = "#20223a";
    ctx.font = "bold 9px monospace";
    ctx.fillText("회의?", o.x + 5, o.flyY + 11);
  } else if (o.type === "phone") {
    const shake = Math.sin(animT * 40) * 1.5;
    ctx.drawImage(SPR.phone, o.x + shake, GROUND - 14);
    if (Math.floor(animT * 6) % 2) {
      ctx.fillStyle = "#ffd166";
      ctx.font = "8px monospace";
      ctx.fillText("따르릉!", o.x, GROUND - 18);
    }
  } else if (o.type === "chair") {
    ctx.fillStyle = "#20223a";
    ctx.fillRect(o.x + 2, y, 6, 22);
    ctx.fillRect(o.x, y + 20, o.w, 6);
    ctx.fillRect(o.x + o.w / 2 - 2, y + 26, 4, 5);
    ctx.fillRect(o.x + 2, GROUND - 3, o.w - 4, 3);
    ctx.fillStyle = "#3d5a99";
    ctx.fillRect(o.x + 3, y + 2, 4, 18);
    ctx.fillRect(o.x + 1, y + 21, o.w - 2, 3);
  } else if (o.type === "boss") {
    ctx.drawImage(SPR.boss, o.x - 3, GROUND - 40);
    if (Math.floor(animT * 4) % 2) {
      ctx.fillStyle = "#e94560";
      ctx.font = "10px monospace";
      ctx.fillText("💢", o.x + 4, GROUND - 44);
    }
  } else if (o.type === "banner") {
    ctx.fillStyle = "#5a4632";
    ctx.fillRect(o.x + o.w / 2 - 1, 0, 2, 14);
    ctx.fillStyle = "#e94560";
    ctx.fillRect(o.x, 14, o.w, GROUND - 24 - 14);
    ctx.fillStyle = "#fff";
    ctx.save();
    ctx.translate(o.x + o.w / 2 + 4, 30);
    ctx.rotate(Math.PI / 2);
    ctx.font = "bold 11px monospace";
    ctx.fillText("회의중", 0, 0);
    ctx.restore();
  } else if (o.type === "spill") {
    ctx.fillStyle = "#7a4a2b";
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2, GROUND, o.w / 2, 4, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = "#a06a3b";
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2 - 4, GROUND - 1, o.w / 4, 2, 0, 0, 7);
    ctx.fill();
  } else if (o.type === "kakao") {
    ctx.drawImage(SPR.kakao, o.x, o.flyY);
    ctx.globalAlpha = 0.35;
    ctx.drawImage(SPR.kakao, o.x + 10, o.flyY + 2);
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(animT * 12) % 2) return;
  if (boostT > 0) {
    ctx.globalAlpha = 0.3;
    ctx.drawImage(SPR.run1, player.x - 26, player.y - 32);
    ctx.globalAlpha = 1;
  }
  if (wingsT > 0) {
    // 레드불 날개
    ctx.fillStyle = "#4cc9f0";
    const flap = Math.sin(animT * 16) * 3;
    ctx.fillRect(player.x - 22, player.y - 24 + flap, 6, 3);
    ctx.fillRect(player.x - 26, player.y - 22 + flap, 6, 3);
  }
  let spr;
  if (player.sliding) spr = SPR.slide;
  else if (!player.onGround) spr = SPR.jump;
  else spr = Math.floor(animT * 10) % 2 ? SPR.run1 : SPR.run2;
  if (player.sliding) ctx.drawImage(spr, player.x - 16, GROUND - 20);
  else ctx.drawImage(spr, player.x - 16, player.y - 32);
  if (slowT > 0) {
    ctx.fillStyle = "#ff9e44";
    ctx.font = "10px monospace";
    ctx.fillText("🐌", player.x + 12, player.y - 30);
  }
}

function drawQuip(px, py) {
  if (!quip) return;
  ctx.font = "bold 10px monospace";
  const w = ctx.measureText(quip.txt).width + 10;
  const x = Math.max(4, Math.min(W - w - 4, px - w / 2));
  const y = py;
  ctx.globalAlpha = Math.min(1, quip.t * 3);
  ctx.fillStyle = "#f5f5f5";
  ctx.fillRect(x, y - 12, w, 15);
  ctx.fillStyle = "#20223a";
  ctx.fillText(quip.txt, x + 5, y - 1);
  ctx.globalAlpha = 1;
}

function drawHearts() {
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < hearts ? "#e94560" : "#343a55";
    const hx = 10 + i * 16, hy = 10;
    ctx.fillRect(hx, hy + 2, 4, 4); ctx.fillRect(hx + 8, hy + 2, 4, 4);
    ctx.fillRect(hx, hy + 4, 12, 4); ctx.fillRect(hx + 2, hy + 8, 8, 2);
    ctx.fillRect(hx + 4, hy + 10, 4, 2);
  }
}

function drawToasts() {
  toasts.forEach((t, i) => {
    const slide = Math.min(1, t.t * 4) * Math.min(1, (t.life - t.t) * 3);
    ctx.globalAlpha = slide;
    ctx.font = "bold 11px monospace";
    const w = ctx.measureText(t.txt).width + 16;
    const x = W / 2 - w / 2, y = 100 + i * 22;
    ctx.fillStyle = "#20223a";
    ctx.fillRect(x, y, w, 18);
    ctx.strokeStyle = "#ffd166";
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 17);
    ctx.fillStyle = "#ffd166";
    ctx.fillText(t.txt, x + 8, y + 13);
    ctx.globalAlpha = 1;
  });
}

function drawFloats() {
  floats.forEach(f => {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = f.col;
    ctx.font = "bold 11px monospace";
    ctx.fillText(f.txt, f.x, f.y - f.t * 30);
    ctx.globalAlpha = 1;
  });
}

function drawRankProgress(y) {
  const total = Number(localStorage.getItem(LS.total) || 0);
  const idx = rankFor(total);
  const r = RANKS[idx];
  ctx.textAlign = "center";
  if (idx < RANKS.length - 1) {
    const next = RANKS[idx + 1];
    const span = next.need - r.need;
    const prog = Math.min(1, (total - r.need) / span);
    ctx.fillStyle = "#9aa0b5";
    ctx.font = "10px monospace";
    ctx.fillText(`${r.emoji} ${r.name}(시급 ${Math.round(MIN_WAGE * r.wage).toLocaleString()}원) → ${next.emoji} ${next.name}까지 ${(next.need - total).toLocaleString()}원`, W / 2, y);
    const bw = 180;
    ctx.fillStyle = "#272b40";
    ctx.fillRect(W / 2 - bw / 2, y + 5, bw, 7);
    ctx.fillStyle = "#4cc9f0";
    ctx.fillRect(W / 2 - bw / 2, y + 5, bw * prog, 7);
  } else {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 11px monospace";
    ctx.fillText("👑 회장 달성! 더 오를 곳이 없다", W / 2, y);
  }
  ctx.textAlign = "left";
}

function render() {
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);

  if (state === "weekend" || state === "wkresult") {
    drawWeekend();
    drawFloats();
    particles.forEach(p => {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.globalAlpha = 1;
    });
    drawToasts();
    if (state === "wkresult") {
      drawCenterPanel([
        ["주말 종료...", 22, "#ffd166", 110],
        ["주말 수익: " + (wk.score >= 0 ? "+" : "") + wk.score.toLocaleString() + "원", 14, wk.score >= 0 ? "#06d6a0" : "#e94560", 140],
        ["멘탈 +1 회복! 다시 출근이다...", 12, "#c0c8e0", 164],
      ], null);
    }
    ctx.restore();
    drawMuteTag();
    return;
  }

  drawBg(false);
  items.forEach(it => {
    const spr = it.type === "coffee" ? SPR.coffee
              : it.type === "pay" ? SPR.pay
              : it.type === "redbull" ? SPR.redbull
              : it.type === "chick" ? SPR.chicken
              : SPR.energy;
    ctx.drawImage(spr, it.x, it.y);
  });
  obstacles.forEach(drawObstacle);
  drawPlayer();
  drawQuip(player.x, player.y - (player.sliding ? 24 : 36));
  particles.forEach(p => {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  });
  drawFloats();

  if (overtimeOn && state === "play") {
    ctx.fillStyle = "rgba(5,5,20,.34)";
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 90, W / 2, H / 2, 280);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(10,0,20,.55)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (slowT > 0 && state === "play") {
    ctx.fillStyle = "rgba(120,120,140,.12)";
    ctx.fillRect(0, 0, W, H);
  }

  drawHud();
  drawToasts();

  if (flashT > 0) {
    ctx.fillStyle = `rgba(233,69,96,${flashT})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === "title") {
    const total = Number(localStorage.getItem(LS.total) || 0);
    const rIdx = rankFor(total);
    const achCount = Object.keys(achState).length;
    drawCenterPanel([
      ["직장인 러너", 30, "#ffd166", 76],
      ["─ 출근 대작전 ─", 13, "#4cc9f0", 98],
      ["하루 8시간 근무, 수입은 직급별 시급으로!", 11, "#c0c8e0", 124],
      ["퇴근 전 야근 장애물(보고서·회의·전화)에 맞으면 느려짐", 11, "#c0c8e0", 141],
      ["☕ 커피 콤보 · ⚡ 무적 질주 · 🪽 레드불 3단 점프", 11, "#c0c8e0", 158],
      ["금요일을 버티면 🛌 주말 보너스 게임!", 11, "#ffd166", 175],
    ], "▶ 스페이스 / 탭하여 출근 시작");
    ctx.textAlign = "center";
    ctx.fillStyle = "#c0c8e0";
    ctx.font = "bold 11px monospace";
    const wageNow = Math.round(MIN_WAGE * RANKS[rIdx].wage);
    ctx.fillText(`${RANKS[rIdx].emoji} ${RANKS[rIdx].name} (시급 ${wageNow.toLocaleString()}원) · 누적 ${total.toLocaleString()}원 · 🏆 ${achCount}/${ACH.length}`, W / 2, 195);
    const best = localStorage.getItem(LS.best);
    if (best) {
      ctx.fillStyle = "#6c7293";
      ctx.font = "11px monospace";
      ctx.fillText("최고 기록: " + Number(best).toLocaleString() + "원", W / 2, 236);
    }
    ctx.textAlign = "left";
  } else if (state === "over") {
    const best = Number(localStorage.getItem(LS.best) || 0);
    const isBest = Math.floor(score) >= best && best > 0;
    if (promoted && promoRank) {
      drawCenterPanel([
        ["🎉 승진!! 🎉", 26, "#ffd166", 78],
        [promoRank.emoji + " " + promoRank.name + " (시급 " + Math.round(MIN_WAGE * promoRank.wage).toLocaleString() + "원)", 15, "#06d6a0", 106],
        [Math.floor(score).toLocaleString() + "원 벌었다" + (isBest ? " ★신기록" : ""), 14, "#fff", 136],
        [Math.floor(dist) + "m · ☕" + coffee + " · 아찔 " + nearMiss + "회 · 콤보 x" + maxCombo, 11, "#9aa0b5", 156],
      ], "▶ 스페이스 / 탭하여 재출근");
      for (let i = 0; i < 14; i++) {
        const cx = (i * 53 + animT * 40) % W;
        const cy = (i * 37 + animT * 60) % 70;
        ctx.fillStyle = ["#ffd166", "#06d6a0", "#e94560", "#4cc9f0"][i % 4];
        ctx.fillRect(cx, cy, 4, 4);
      }
    } else {
      drawCenterPanel([
        ["번아웃!", 30, "#e94560", 74],
        [overMsg, 12, "#c0c8e0", 98],
        [Math.floor(score).toLocaleString() + "원 벌었다" + (isBest ? " ★신기록!" : ""), 18, "#06d6a0", 128],
        [Math.floor(dist) + "m 출근 · ☕" + coffee + "잔 · 아찔 " + nearMiss + "회 · 콤보 x" + maxCombo + " · " + (week + 1) + "주차", 10, "#9aa0b5", 148],
      ], "▶ 스페이스 / 탭하여 재출근");
    }
    drawRankProgress(174);
  } else if (state === "pause") {
    drawCenterPanel([["일시정지", 24, "#ffd166", 130], ["(몰래 쉬는 중)", 12, "#9aa0b5", 152]], "P 키로 복귀");
  }

  ctx.restore();
  drawMuteTag();
}

function drawMuteTag() {
  if (SND.muted) {
    ctx.fillStyle = "#6c7293";
    ctx.font = "10px monospace";
    ctx.fillText("🔇 M", 10, H - 8);
  }
}

/* ── 메인 루프 ──────────────────────────────────────────── */
function loop(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000 || 0.016);
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play") state = "pause";
});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
