name: Deploy to GitHub Pages

# 기본 브랜치에 push되면 사이트 파일을 gh-pages 브랜치로 발행한다.
# (GITHUB_TOKEN으로는 Pages 사이트 생성이 불가하므로,
#  자동 활성화되는 gh-pages 브랜치 방식을 사용)
on:
  push:
    branches:
      - claude/expand-korean-market-strategy-dPuXy # 기본 브랜치
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,*.md'
