<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직장인 생존기: 월급날까지 버텨라!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #12141d;
    --card: #1d2030;
    --card-light: #272b40;
    --accent: #ffd166;
    --green: #06d6a0;
    --red: #ef476f;
    --blue: #4cc9f0;
    --text: #eef0f6;
    --muted: #9aa0b5;
  }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #app {
    width: 100%;
    max-width: 560px;
  }

  .screen { animation: fadeIn .35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 타이틀 화면 ───────────────────────── */
  .title-screen {
    text-align: center;
    background: var(--card);
    border-radius: 20px;
    padding: 40px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    position: relative;
  }
  .title-emoji { font-size: 60px; }
  .title-screen h1 {
    font-size: 28px;
    margin: 14px 0 6px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .title-screen .subtitle {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .rules {
    background: var(--card-light);
    border-radius: 12px;
    padding: 14px 18px;
    text-align: left;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 22px;
  }
  .rules b { color: var(--accent); }
  .best-record {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .rank-heading {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--blue);
  }

  /* ── 공통 버튼 ─────────────────────────── */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover  { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, #ffd166, #ff9e44);
    color: #1d2030;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 44px;
    box-shadow: 0 6px 18px rgba(255, 158, 68, .35);
  }

  .mute-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--card-light);
    color: var(--text);
    font-size: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
  }

  /* ── 직급 선택 카드 ─────────────────────── */
  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .rank-card {
    background: var(--card-light);
    color: var(--text);
    border: 1px solid #343a55;
    text-align: left;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
  }
  .rank-card:hover { border-color: var(--accent); }
  .rank-card .rank-name { font-size: 16px; font-weight: 800; color: var(--accent); }
  .rank-card .rank-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rank-card .rank-perk { font-size: 12px; color: var(--green); margin-top: 2px; }
  .rank-card .num {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    background: var(--accent);
    color: #1d2030;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    margin-right: 8px;
  }

  /* ── 게임 헤더 (요일/시간/스탯) ────────── */
  .hud {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    position: relative;
  }
  .hud .mute-btn { top: 12px; right: 56px; width: 32px; height: 32px; font-size: 13px; }
  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-right: 40px;
  }
  .day-badge {
    font-size: 17px;
    font-weight: 800;
    color: var(--accent);
  }
  .combo-badge {
    font-size: 12px;
    font-weight: 700;
    color: #ff9e44;
    background: rgba(255,158,68,.12);
    padding: 3px 10px;
    border-radius: 99px;
    margin-left: 8px;
  }
  .time-badge {
    font-size: 12px;
    color: var(--muted);
    background: var(--card-light);
    padding: 4px 12px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .week-track {
    display: flex;
    gap: 5px;
    margin-bottom: 14px;
  }
  .week-track span {
    flex: 1;
    text-align: center;
    font-size: 12px;
    padding: 5px 0;
    border-radius: 8px;
    background: var(--card-light);
    color: var(--muted);
  }
  .week-track span.done   { background: #2a4a3e; color: var(--green); }
  .week-track span.today  { background: var(--accent); color: #1d2030; font-weight: 700; }
  .week-track span.bonus  { border: 1px dashed #ff9e44; color: #ff9e44; }
  .week-track span.bonus.today { background: #ff9e44; color: #1d2030; border-style: solid; }

  .stat { margin-bottom: 10px; }
  .stat:last-child { margin-bottom: 0; }
  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .stat-label .val { color: var(--muted); }
  .bar {
    height: 10px;
    background: var(--card-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .5s ease, background .5s ease;
  }
  .bar-fill.mental { background: linear-gradient(90deg, #06d6a0, #4cc9f0); }
  .bar-fill.hp     { background: linear-gradient(90deg, #ffd166, #ff9e44); }
  .bar-fill.rep    { background: linear-gradient(90deg, #c77dff, #4cc9f0); }
  .bar-fill.low    { background: var(--red) !important; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ── 이벤트 카드 ───────────────────────── */
  .event-card {
    background: var(--card);
    border-radius: 16px;
    padding: 26px 24px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .event-slot {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .event-text {
    font-size: 17px;
    line-height: 1.75;
    margin-bottom: 22px;
    white-space: pre-line;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    background: var(--card-light);
    color: var(--text);
    text-align: left;
    font-size: 15px;
    line-height: 1.5;
    padding: 14px 16px;
    border: 1px solid #343a55;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn .num {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    background: var(--accent);
    color: #1d2030;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    margin-right: 10px;
  }

  /* ── 결과 표시 ─────────────────────────── */
  .result-text {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .deltas {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .delta {
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 99px;
    background: var(--card-light);
  }
  .delta.up   { color: var(--green); }
  .delta.down { color: var(--red); }
  .combo-note {
    font-size: 13px;
    font-weight: 700;
    color: #ff9e44;
    margin: -10px 0 18px;
  }
  .btn-next {
    background: var(--blue);
    color: #12141d;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 32px;
    width: 100%;
  }

  /* ── 엔딩 화면 ─────────────────────────── */
  .ending-screen {
    text-align: center;
    background: var(--card);
    border-radius: 20px;
    padding: 44px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .ending-emoji { font-size: 72px; animation: bounce .8s ease; }
  @keyframes bounce {
    0%   { transform: scale(.3); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .ending-title {
    font-size: 26px;
    font-weight: 800;
    margin: 16px 0 10px;
    color: var(--accent);
  }
  .ending-desc {
    font-size: 15px;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .score-box {
    background: var(--card-light);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .score-box .label { font-size: 13px; color: var(--muted); }
  .score-box .score { font-size: 38px; font-weight: 800; color: var(--green); }
  .score-box .breakdown { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .score-box .title-earned { font-size: 16px; font-weight: 700; color: var(--blue); margin-top: 6px; }
  .new-record { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 14px; }

  .ending-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-share {
    background: var(--card-light);
    color: var(--blue);
    border: 1px solid var(--blue);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px;
  }

  .footer-tip {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }

  .v2-link {
    display: block;
    margin-top: 14px;
    padding: 13px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4cc9f0, #c77dff);
    color: #12141d;
    font-size: 15px;
    font-weight: 800;
    text-decoration: none;
    text-align: center;
    transition: transform .12s ease, filter .12s ease;
  }
  .v2-link:hover { transform: translateY(-2px); filter: brightness(1.1); }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   직장인 생존기: 월급날까지 버텨라!
   월~금 5일 + 주말 보너스를 버티며 월급날에 도달하는 게임
   ══════════════════════════════════════════════════════════ */

const DAYS    = ["월", "화", "수", "목", "금"];
const WEEKEND = ["토", "일"];
const SLOTS = ["출근길", "오전 업무", "점심시간", "오후 업무", "퇴근 시간"];
const SLOT_TIMES = ["08:30", "10:00", "12:30", "15:00", "18:00"];
const WEEKEND_SLOT = 5;
const COMBO_THRESHOLD = 40; // 하루를 마칠 때 모든 스탯이 이 값 이상이면 콤보 적립

const GAME_URL = "https://jaythealpha.github.io/Jay/";

const STAT_META = {
  mental: { name: "멘탈",     emoji: "🧠", cls: "mental" },
  hp:     { name: "체력",     emoji: "⚡", cls: "hp" },
  rep:    { name: "사회생활", emoji: "🤝", cls: "rep" },
};

/* ── 직급 정의 ──
   perk — intern: 체력 회복 1.5배 / daeri: 콤보 보너스 20점 / gwajang: 사회생활 감소 절반 */
const RANKS = {
  intern: {
    label: "인턴", name: "김인턴", emoji: "🐣",
    mental: 75, hp: 85, rep: 45,
    perk: "체력 회복 효과 1.5배 (젊음이 무기)",
    desc: "체력 하나는 자신 있다. 사회생활은... 아직 배우는 중.",
  },
  daeri: {
    label: "대리", name: "김대리", emoji: "💼",
    mental: 70, hp: 70, rep: 60,
    perk: "출근 콤보 보너스 +5점 (꾸준함의 화신)",
    desc: "일도 눈치도 적당히 아는 밸런스형 중간 연차.",
  },
  gwajang: {
    label: "과장", name: "박과장", emoji: "👔",
    mental: 60, hp: 60, rep: 80,
    perk: "사회생활 감소량 절반 (짬에서 나오는 바이브)",
    desc: "조직 생활의 달인. 다만 몸과 멘탈이 예전 같지 않다.",
  },
};

/* ── 이벤트 데이터 ──────────────────────────────────────────
   slot: 0 출근길 / 1 오전 / 2 점심 / 3 오후 / 4 퇴근 / 5 주말
   {P}는 플레이어 이름(직급별)으로 치환된다.
   choice: { t: 선택지, d: {mental, hp, rep}, r: 결과 텍스트 } */
const EVENTS = [

  /* ───── 출근길 ───── */
  { slot: 0, text: "🚇 지하철 문이 열리자마자 인파가 쏟아진다.\n오늘도 2호선은 만원. 숨 쉴 공간조차 없다.",
    choices: [
      { t: "이 악물고 비집고 들어간다", d: { hp: -10, mental: -5 },
        r: "낯선 사람의 겨드랑이와 함께한 40분.\n출근 전에 이미 하루치 에너지를 다 썼다." },
      { t: "다음 열차를 기다린다", d: { mental: 5, rep: -8 },
        r: "여유롭게 탔지만 5분 지각.\n부장님의 시계 보는 눈빛이 등에 꽂힌다." },
      { t: "그냥 택시를 탄다", d: { mental: 8, hp: 3, rep: 2 },
        r: "쾌적한 출근! 하지만 택시비 18,000원...\n오늘 점심은 편의점 삼각김밥 확정이다." },
    ]},
  { slot: 0, text: "⏰ 눈을 떴는데 알람이 안 울렸다.\n현재 시각 8시 10분. 회사까지 50분 거리.",
    choices: [
      { t: "씻지도 못하고 전력질주", d: { hp: -12, rep: 5 },
        r: "기적적으로 정시 도착!\n하지만 거울 속 내 모습은... 보지 말자." },
      { t: "\"몸이 안 좋아서 30분 늦습니다\" 문자", d: { mental: -5, rep: -5 },
        r: "거짓말의 대가로 양심이 콕콕 쑤신다.\n부장님 답장: \"ㅇㅋ\" ...2글자가 왜 이리 무섭지." },
      { t: "이왕 늦은 거 여유롭게 준비한다", d: { mental: 6, rep: -12 },
        r: "샤워도 하고 머리도 했다. 단정하게 1시간 지각.\n사무실 공기가 시베리아다." },
    ]},
  { slot: 0, text: "☔ 갑자기 쏟아지는 폭우. 우산이 없다.\n편의점 우산은 9,000원이다.",
    choices: [
      { t: "9,000원 우산을 산다", d: { mental: -3, rep: 2 },
        r: "집에 똑같은 비닐우산이 7개 있는데 8개가 됐다.\n그래도 뽀송하게 도착." },
      { t: "그냥 뛴다", d: { hp: -8, mental: -5 },
        r: "물에 빠진 생쥐 꼴로 도착.\n동기가 묻는다. \"샤워하고 왔어?\" ...웃기냐." },
      { t: "비 그칠 때까지 카페에서 대기", d: { mental: 8, rep: -8 },
        r: "따뜻한 라떼와 함께하는 평화로운 아침.\n단, 30분 지각이라는 작은 문제가 있다." },
    ]},
  { slot: 0, text: "🐶 월요일 아침, 침대에서 몸이 떨어지지 않는다.\n'아... 회사 가기 싫다'는 생각이 머리를 가득 채운다.",
    choices: [
      { t: "'월급... 월급...' 주문을 외우며 일어난다", d: { mental: -3, rep: 3 },
        r: "통장에 스쳐 갈 월급을 생각하며 좀비처럼 기상.\n프로 직장인의 자세다." },
      { t: "5분만 더... (스누즈 3연타)", d: { hp: 5, rep: -6 },
        r: "5분이 25분이 되는 마법.\n아침밥은 포기했지만 꿀잠은 챙겼다." },
      { t: "로또 당첨 상상으로 현실도피", d: { mental: 7, hp: -2 },
        r: "사직서를 던지는 상상만으로 행복해졌다.\n상상 속에서 이미 3번 퇴사했다." },
    ]},
  { slot: 0, text: "🚗 버스에서 마침내 자리가 났다!\n그 순간, 어르신 한 분이 타셨다.",
    choices: [
      { t: "당연히 양보한다", d: { hp: -5, mental: 6, rep: 3 },
        r: "\"고마워요 총각/아가씨~\"\n다리는 아프지만 마음은 따뜻하다. 오늘 운세 좋을 듯." },
      { t: "자는 척한다", d: { mental: -8, hp: 5 },
        r: "눈을 감았지만 마음이 불편하다.\n내릴 때까지 눈을 못 떴다. 목만 아프다." },
    ]},
  { slot: 0, text: "📱 출근길 단톡방에 부장님 메시지.\n\"오늘 아침 회의 8시 반으로 당깁니다^^\"\n현재 시각 8시 20분.",
    choices: [
      { t: "\"네! 가고 있습니다!\" (전력질주)", d: { hp: -10, rep: 6 },
        r: "헐떡이며 도착하니 부장님 왈,\n\"회의 9시로 다시 미뤄졌어~\" ...실화냐." },
      { t: "메시지 못 본 척한다", d: { mental: 3, rep: -7 },
        r: "\"{P} 톡 안 봤어?\" \"아 지하철이라 신호가...\"\n읽음 표시는 이미 떠 있었다. 들켰다." },
    ]},
  { slot: 0, text: "🛗 엘리베이터에 탔는데 사장님과 단둘이 됐다.\n15층까지 남은 시간, 영원처럼 느껴지는 30초.",
    choices: [
      { t: "우렁차게 인사만 한다", d: { rep: 3 },

const SFX = {
  ctx: null,
  muted: localStorage.getItem("office-sfx-muted") === "1",
  ensure() {
    if (this.muted) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, start, dur, type = "sine", vol = 0.12) {
    const ctx = this.ensure();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + start;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  },
  click() { this.tone(700, 0, 0.06, "square", 0.05); },
  good()  { this.tone(523, 0, 0.1); this.tone(784, 0.09, 0.16); },
  bad()   { this.tone(220, 0, 0.15, "sawtooth", 0.07); this.tone(165, 0.12, 0.2, "sawtooth", 0.07); },
  combo() { [659, 784, 988].forEach((f, i) => this.tone(f, i * 0.08, 0.12, "triangle", 0.1)); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.12, 0.2)); },
  lose()  { [392, 330, 262, 196].forEach((f, i) => this.tone(f, i * 0.15, 0.25, "triangle", 0.1)); },
  toggle() {
    this.muted = !this.muted;
    localStorage.setItem("office-sfx-muted", this.muted ? "1" : "0");
    document.querySelectorAll(".mute-btn").forEach(b => b.textContent = this.muted ? "🔇" : "🔊");
  },
};

function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

/* ── 게임 상태 ── */
let S = null;
let LAST = null; // 엔딩 공유용 결과

function newState(rankKey) {
  const r = RANKS[rankKey];
  return {
    rankKey,
    name: r.name,
    day: 0,          // 0~4 평일, 5~6 주말 보너스
    slot: 0,
    mental: r.mental,
    hp: r.hp,
    rep: r.rep,
    combo: 0,        // 풀충전 출근 콤보 (하루 마감 시 전 스탯 40 이상)
    comboGained: false,
    used: new Set(),
    current: null,
  };
}

const app = document.getElementById("app");
const clamp = (v) => Math.max(0, Math.min(100, v));
const bestKey = "office-survivor-best";
const isWeekend = () => S.day >= 5;
const fillName = (txt) => txt.replaceAll("{P}", S.name);

function muteBtnHTML() {
  return `<button class="mute-btn" onclick="SFX.toggle()" title="효과음 켜기/끄기">${SFX.muted ? "🔇" : "🔊"}</button>`;
}

/* ── 타이틀 + 직급 선택 화면 ── */
function showTitle() {
  const best = localStorage.getItem(bestKey);
  const rankCards = Object.entries(RANKS).map(([key, r], i) => `
    <button class="choice-btn rank-card" onclick="startGame('${key}')">
      <span class="num">${i + 1}</span>
      <span class="rank-name">${r.emoji} ${r.name} (${r.label})</span><br>
      <span class="rank-stats">🧠 ${r.mental} · ⚡ ${r.hp} · 🤝 ${r.rep} — ${r.desc}</span><br>
      <span class="rank-perk">특성: ${r.perk}</span>
    </button>`).join("");

  app.innerHTML = `
    <div class="screen title-screen">
      ${muteBtnHTML()}
      <div class="title-emoji">🏢</div>
      <h1>직장인 생존기</h1>
      <div class="subtitle">월요일 출근부터 금요일 퇴근, 그리고 주말까지.<br>당신의 일주일을 무사히 버텨내세요!</div>
      <div class="rules">
        🧠 <b>멘탈</b> — 바닥나면 홧김에 사직서를 던집니다<br>
        ⚡ <b>체력</b> — 바닥나면 번아웃으로 쓰러집니다<br>
        🤝 <b>사회생활</b> — 바닥나면 면담실로 불려갑니다<br>
        🔥 하루를 <b>전 스탯 40 이상</b>으로 마치면 출근 콤보 적립!<br>
        🎁 금요일까지 버티면 <b>주말 보너스</b> 후 월급날이 옵니다
      </div>
      ${best ? `<div class="best-record">🏅 최고 기록: ${best}점</div>` : ""}
      <div class="rank-heading">직급을 선택하세요</div>
      <div class="rank-list">${rankCards}</div>
      <a class="v2-link" href="./v2.html">🕹️ NEW! 16비트 아케이드 버전 플레이 →</a>
      <div class="footer-tip">선택지는 키보드 1, 2, 3으로도 고를 수 있어요</div>
    </div>`;
}

function startGame(rankKey) {
  SFX.click();
  buzz(15);
  S = newState(rankKey);
  nextEvent();
}

/* ── 이벤트 선택 ── */
function pickEvent() {
  const slot = isWeekend() ? WEEKEND_SLOT : S.slot;
  const pool = EVENTS
    .map((e, i) => ({ e, i }))
    .filter(({ e, i }) => e.slot === slot && !S.used.has(i));
  if (pool.length === 0) {
    const all = EVENTS.map((e, i) => ({ e, i })).filter(({ e }) => e.slot === slot);
    return all[Math.floor(Math.random() * all.length)];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function nextEvent() {
  const picked = pickEvent();
  S.used.add(picked.i);
  S.current = picked.e;
  renderEvent();
}

/* ── HUD 렌더 ── */
function hudHTML() {
  const weekdayCells = DAYS.map((d, i) => {
    const cls = i < S.day ? "done" : i === S.day ? "today" : "";
    return `<span class="${cls}">${d}</span>`;
  }).join("");
  const weekendCells = WEEKEND.map((d, i) => {
    const di = 5 + i;
    const cls = "bonus " + (di < S.day ? "done" : di === S.day ? "today" : "");
    return `<span class="${cls}">${d}</span>`;
  }).join("");

  const bars = Object.entries(STAT_META).map(([key, m]) => {
    const v = S[key];
    const low = v <= 25 ? "low" : "";
    return `
      <div class="stat">
        <div class="stat-label">
          <span>${m.emoji} ${m.name}</span><span class="val">${v}/100</span>
        </div>
        <div class="bar"><div class="bar-fill ${m.cls} ${low}" style="width:${v}%"></div></div>
      </div>`;
  }).join("");

  const dayLabel = isWeekend()
    ? `🎁 ${WEEKEND[S.day - 5]}요일`
    : `${DAYS[S.day]}요일`;
  const timeLabel = isWeekend()
    ? "주말 보너스 스테이지"
    : `🕐 ${SLOT_TIMES[S.slot]} · ${SLOTS[S.slot]}`;
  const comboLabel = S.combo > 0 ? `<span class="combo-badge">🔥 콤보 ${S.combo}일</span>` : "";

  return `
    <div class="hud">
      ${muteBtnHTML()}
      <div class="hud-top">
        <span><span class="day-badge">${dayLabel}</span>${comboLabel}</span>
        <span class="time-badge">${timeLabel}</span>
      </div>
      <div class="week-track">${weekdayCells}${weekendCells}</div>
      ${bars}
    </div>`;
}

/* ── 이벤트 화면 ── */
function renderEvent() {
  const ev = S.current;
  const choices = ev.choices.map((c, i) => `
    <button class="choice-btn" onclick="choose(${i})">
      <span class="num">${i + 1}</span>${fillName(c.t)}
    </button>`).join("");

  const slotLabel = isWeekend() ? "주말 보너스" : SLOTS[S.slot].toUpperCase();
  app.innerHTML = `
    <div class="screen">
      ${hudHTML()}
      <div class="event-card">
        <div class="event-slot">${slotLabel}</div>
        <div class="event-text">${fillName(ev.text)}</div>
        <div class="choices">${choices}</div>
      </div>
    </div>`;
}

/* ── 선택 처리 (직급 특성 적용) ── */
function applyPerk(key, d) {
  if (S.rankKey === "intern" && key === "hp" && d > 0) return Math.round(d * 1.5);
  if (S.rankKey === "gwajang" && key === "rep" && d < 0) return Math.ceil(d / 2);
  return d;
}

function choose(idx) {
  SFX.click();
  buzz(15);
  const c = S.current.choices[idx];
  const deltas = [];
  let net = 0;
  for (const [key, m] of Object.entries(STAT_META)) {
    let d = c.d[key] || 0;
    if (d !== 0) {
      d = applyPerk(key, d);
      S[key] = clamp(S[key] + d);
      net += d;
      deltas.push(`<span class="delta ${d > 0 ? "up" : "down"}">${m.emoji} ${m.name} ${d > 0 ? "+" : ""}${d}</span>`);
    }
  }

  if (net >= 0) { SFX.good(); } else { SFX.bad(); buzz(70); }

  app.innerHTML = `
    <div class="screen">
      ${hudHTML()}
      <div class="event-card">
        <div class="event-slot">결과</div>
        <div class="result-text">${fillName(c.r)}</div>
        <div class="deltas">${deltas.join("") || '<span class="delta">변화 없음</span>'}</div>
        <button class="btn-next" onclick="advance()">계속하기 →</button>
      </div>
    </div>`;
}

/* ── 진행 / 콤보 / 게임오버 판정 ── */
function advance() {
  if (S.mental <= 0) return showEnding("burst");
  if (S.hp <= 0)     return showEnding("burnout");
  if (S.rep <= 0)    return showEnding("fired");

  S.comboGained = false;

  if (isWeekend()) {
    // 주말은 하루 1이벤트
    S.day++;
    if (S.day >= 7) return showEnding("payday");
    return nextEvent();
  }

  S.slot++;
  if (S.slot >= SLOTS.length) {
    // 하루 마감 — 풀충전 콤보 판정
    if (S.mental >= COMBO_THRESHOLD && S.hp >= COMBO_THRESHOLD && S.rep >= COMBO_THRESHOLD) {
      S.combo++;
      S.comboGained = true;
      SFX.combo();
    } else {
      S.combo = 0;
    }
    S.slot = 0;
    S.day++;
    if (S.day === 5) return showWeekendIntro();
  }
  nextEvent();
}

/* ── 주말 보너스 안내 ── */
function showWeekendIntro() {
  SFX.win();
  buzz([50, 40, 50]);
  app.innerHTML = `
    <div class="screen ending-screen">
      <div class="ending-emoji">🎉</div>
      <div class="ending-title">금요일 퇴근 성공!</div>
      <div class="ending-desc">한 주를 버텨낸 당신에게 주말이 주어졌다.\n주말을 어떻게 보내느냐에 따라\n최종 점수가 달라진다!\n\n🎁 보너스 스테이지: 토요일 · 일요일</div>
      <button class="btn-primary" onclick="nextEvent()">주말 시작하기</button>
    </div>`;
}

/* ── 엔딩 ── */
function showEnding(type) {
  const statSum = S.mental + S.hp + S.rep;
  const comboRate = S.rankKey === "daeri" ? 20 : 15;
  const comboBonus = S.combo * comboRate;
  const score = statSum + comboBonus;
  const survived = type === "payday";

  const endings = {
    burst: {
      emoji: "📄", title: "멘탈 붕괴 퇴사",
      desc: "더는 참을 수 없었다.\n품속의 사직서가 부장님 책상 위로 날아갔다.\n\"그동안 감사했습니다!\"\n\n...3초간 짜릿했고, 카드값 알림과 함께 현실로 돌아왔다.",
    },
    burnout: {
      emoji: "🏥", title: "번아웃 — 강제 휴식",
      desc: "몸이 먼저 파업을 선언했다.\n눈을 떠 보니 링거를 맞고 있다.\n\n의사: \"과로입니다. 푹 쉬세요.\"\n부장님 문자: \"몸조리 잘하고~ 보고서는 메일로 부탁해^^\"",
    },
    fired: {
      emoji: "🚪", title: "면담실로 오세요",
      desc: "인사팀에서 호출이 왔다.\n\"요즘 팀 분위기에 대해 얘기 좀 할까요?\"\n\n사회생활도 실력이라는 걸\n뼈저리게 배운 한 주였다.",
    },
    payday: {
      emoji: "💰", title: "월급날 생존 성공!",
      desc: "주말까지 알차게 보내고 맞이한 월요일 아침.\n도착한 문자 한 통.\n\n[입금] 급여 ***원\n\n통장을 스쳐 가는 월급마저 아름답다.\n다음 주도... 버텨보자.",
    },
  };

  let e = endings[type];
  if (survived && score >= 280) {
    e = {
      emoji: "👑", title: "이달의 우수사원",
      desc: "멘탈, 체력, 사회생활 모두 지켜낸 완벽한 한 주!\n부장님: \"" + S.name + ", 자네 같은 인재는 처음이야.\"\n\n...라는 칭찬과 함께 일이 2배로 늘었다.\n유능함의 저주란 이런 것이다.",
    };
  }

  const title = survived
    ? TITLES.find(x => score >= x.min).t
    : "중도 하차 😵";

  if (survived) { SFX.win(); buzz([50, 50, 50, 50, 150]); }
  else          { SFX.lose(); buzz([100, 50, 100, 50, 200]); }

  let recordHTML = "";
  if (survived) {
    const best = Number(localStorage.getItem(bestKey) || 0);
    if (score > best) {
      localStorage.setItem(bestKey, String(score));
      recordHTML = `<div class="new-record">🎉 신기록 달성!</div>`;
    }
  }

  LAST = { endingTitle: e.title, score, title, rank: RANKS[S.rankKey], survived, combo: S.combo };

  const breakdown = survived && S.combo > 0
    ? `<div class="breakdown">스탯 합계 ${statSum} + 🔥 콤보 보너스 ${comboBonus} (${S.combo}일 × ${comboRate}점)</div>`
    : "";

  app.innerHTML = `
    <div class="screen ending-screen">
      <div class="ending-emoji">${e.emoji}</div>
      <div class="ending-title">${e.title}</div>
      <div class="ending-desc">${e.desc}</div>
      <div class="score-box">
        <div class="label">최종 점수</div>
        <div class="score">${score}점</div>
        ${breakdown}
        <div class="title-earned">칭호: ${title}</div>
      </div>
      ${recordHTML}
      <div class="ending-buttons">
        <button class="btn-primary" onclick="showTitle()">다시 출근하기</button>
        <button class="btn-share" id="share-btn" onclick="shareEnding()">📤 결과 공유</button>
      </div>
      <div class="footer-tip">버티는 모든 직장인을 응원합니다 🙌</div>
    </div>`;
}

/* ── 엔딩 공유 (Web Share API → 클립보드 폴백) ── */
function shareEnding() {
  if (!LAST) return;
  SFX.click();
  const text =
    `🏢 직장인 생존기: 월급날까지 버텨라!\n` +
    `${LAST.rank.emoji} ${LAST.rank.name}로 도전 → ${LAST.endingTitle}\n` +
    `최종 점수 ${LAST.score}점 · 칭호: ${LAST.title}` +
    (LAST.combo > 0 ? ` · 🔥 출근 콤보 ${LAST.combo}일` : "") +
    `\n너도 한 주 버텨볼래? 👉 ${GAME_URL}`;

  if (navigator.share) {
    navigator.share({ title: "직장인 생존기", text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById("share-btn");
      if (btn) {
        btn.textContent = "✅ 복사 완료!";
        setTimeout(() => { btn.textContent = "📤 결과 공유"; }, 2000);
      }
    });
  }
}

/* ── 키보드 입력 (1/2/3 선택, Enter 진행) ── */
document.addEventListener("keydown", (ev) => {
  if (ev.key >= "1" && ev.key <= "3") {
    const btns = document.querySelectorAll(".choice-btn");
    const i = Number(ev.key) - 1;
    if (btns[i]) btns[i].click();
  } else if (ev.key === "Enter") {
    const next = document.querySelector(".btn-next") || document.querySelector(".btn-primary");
    if (next) next.click();
  }
});

showTitle();
</script>
</body>
