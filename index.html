<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직장인 생존기: 월급날까지 버텨라!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #12141d;
    --card: #1d2030;
    --card-light: #272b40;
    --accent: #ffd166;
    --green: #06d6a0;
    --red: #ef476f;
    --blue: #4cc9f0;
    --text: #eef0f6;
    --muted: #9aa0b5;
  }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #app {
    width: 100%;
    max-width: 560px;
  }

  .screen { animation: fadeIn .35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── 타이틀 화면 ───────────────────────── */
  .title-screen {
    text-align: center;
    background: var(--card);
    border-radius: 20px;
    padding: 48px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .title-emoji { font-size: 64px; }
  .title-screen h1 {
    font-size: 28px;
    margin: 18px 0 6px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .title-screen .subtitle {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .rules {
    background: var(--card-light);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: left;
    font-size: 14px;
    line-height: 2;
    color: var(--text);
    margin-bottom: 28px;
  }
  .rules b { color: var(--accent); }
  .best-record {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── 공통 버튼 ─────────────────────────── */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover  { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, #ffd166, #ff9e44);
    color: #1d2030;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 44px;
    box-shadow: 0 6px 18px rgba(255, 158, 68, .35);
  }

  /* ── 게임 헤더 (요일/시간/스탯) ────────── */
  .hud {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .day-badge {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
  }
  .time-badge {
    font-size: 13px;
    color: var(--muted);
    background: var(--card-light);
    padding: 4px 12px;
    border-radius: 99px;
  }
  .week-track {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .week-track span {
    flex: 1;
    text-align: center;
    font-size: 12px;
    padding: 5px 0;
    border-radius: 8px;
    background: var(--card-light);
    color: var(--muted);
  }
  .week-track span.done   { background: #2a4a3e; color: var(--green); }
  .week-track span.today  { background: var(--accent); color: #1d2030; font-weight: 700; }

  .stat { margin-bottom: 10px; }
  .stat:last-child { margin-bottom: 0; }
  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .stat-label .val { color: var(--muted); }
  .bar {
    height: 10px;
    background: var(--card-light);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .5s ease, background .5s ease;
  }
  .bar-fill.mental { background: linear-gradient(90deg, #06d6a0, #4cc9f0); }
  .bar-fill.hp     { background: linear-gradient(90deg, #ffd166, #ff9e44); }
  .bar-fill.rep    { background: linear-gradient(90deg, #c77dff, #4cc9f0); }
  .bar-fill.low    { background: var(--red) !important; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ── 이벤트 카드 ───────────────────────── */
  .event-card {
    background: var(--card);
    border-radius: 16px;
    padding: 26px 24px;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .event-slot {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .event-text {
    font-size: 17px;
    line-height: 1.75;
    margin-bottom: 22px;
    white-space: pre-line;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    background: var(--card-light);
    color: var(--text);
    text-align: left;
    font-size: 15px;
    line-height: 1.5;
    padding: 14px 16px;
    border: 1px solid #343a55;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn .num {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    background: var(--accent);
    color: #1d2030;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    margin-right: 10px;
  }

  /* ── 결과 표시 ─────────────────────────── */
  .result-text {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .deltas {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .delta {
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 99px;
    background: var(--card-light);
  }
  .delta.up   { color: var(--green); }
  .delta.down { color: var(--red); }
  .btn-next {
    background: var(--blue);
    color: #12141d;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 32px;
    width: 100%;
  }

  /* ── 엔딩 화면 ─────────────────────────── */
  .ending-screen {
    text-align: center;
    background: var(--card);
    border-radius: 20px;
    padding: 44px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .ending-emoji { font-size: 72px; animation: bounce .8s ease; }
  @keyframes bounce {
    0%   { transform: scale(.3); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .ending-title {
    font-size: 26px;
    font-weight: 800;
    margin: 16px 0 10px;
    color: var(--accent);
  }
  .ending-desc {
    font-size: 15px;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .score-box {
    background: var(--card-light);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .score-box .label { font-size: 13px; color: var(--muted); }
  .score-box .score { font-size: 38px; font-weight: 800; color: var(--green); }
  .score-box .title-earned { font-size: 16px; font-weight: 700; color: var(--blue); margin-top: 6px; }
  .new-record { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 14px; }

  .footer-tip {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   직장인 생존기: 월급날까지 버텨라!
   월~금 5일간 멘탈/체력/평판을 지키며 월급날에 도달하는 게임
   ══════════════════════════════════════════════════════════ */

const DAYS  = ["월", "화", "수", "목", "금"];
const SLOTS = ["출근길", "오전 업무", "점심시간", "오후 업무", "퇴근 시간"];
const SLOT_TIMES = ["08:30", "10:00", "12:30", "15:00", "18:00"];

const STAT_META = {
  mental: { name: "멘탈",     emoji: "🧠", cls: "mental" },
  hp:     { name: "체력",     emoji: "⚡", cls: "hp" },
  rep:    { name: "사회생활", emoji: "🤝", cls: "rep" },
};

/* ── 이벤트 데이터 ──────────────────────────────────────────
   slot: 0 출근길 / 1 오전 / 2 점심 / 3 오후 / 4 퇴근
   choice: { t: 선택지, d: {mental, hp, rep}, r: 결과 텍스트 } */
const EVENTS = [

  /* ───── 출근길 ───── */
  { slot: 0, text: "🚇 지하철 문이 열리자마자 인파가 쏟아진다.\n오늘도 2호선은 만원. 숨 쉴 공간조차 없다.",
    choices: [
      { t: "이 악물고 비집고 들어간다", d: { hp: -10, mental: -5 },
        r: "낯선 사람의 겨드랑이와 함께한 40분.\n출근 전에 이미 하루치 에너지를 다 썼다." },
      { t: "다음 열차를 기다린다", d: { mental: 5, rep: -8 },
        r: "여유롭게 탔지만 5분 지각.\n부장님의 시계 보는 눈빛이 등에 꽂힌다." },
      { t: "그냥 택시를 탄다", d: { mental: 8, hp: 3, rep: 2 },
        r: "쾌적한 출근! 하지만 택시비 18,000원...\n오늘 점심은 편의점 삼각김밥 확정이다." },
    ]},
  { slot: 0, text: "⏰ 눈을 떴는데 알람이 안 울렸다.\n현재 시각 8시 10분. 회사까지 50분 거리.",
    choices: [
      { t: "씻지도 못하고 전력질주", d: { hp: -12, rep: 5 },
        r: "기적적으로 정시 도착!\n하지만 거울 속 내 모습은... 보지 말자." },
      { t: "\"몸이 안 좋아서 30분 늦습니다\" 문자", d: { mental: -5, rep: -5 },
        r: "거짓말의 대가로 양심이 콕콕 쑤신다.\n부장님 답장: \"ㅇㅋ\" ...2글자가 왜 이리 무섭지." },
      { t: "이왕 늦은 거 여유롭게 준비한다", d: { mental: 6, rep: -12 },
        r: "샤워도 하고 머리도 했다. 단정하게 1시간 지각.\n사무실 공기가 시베리아다." },
    ]},
  { slot: 0, text: "☔ 갑자기 쏟아지는 폭우. 우산이 없다.\n편의점 우산은 9,000원이다.",
    choices: [
      { t: "9,000원 우산을 산다", d: { mental: -3, rep: 2 },
        r: "집에 똑같은 비닐우산이 7개 있는데 8개가 됐다.\n그래도 뽀송하게 도착." },
      { t: "그냥 뛴다", d: { hp: -8, mental: -5 },
        r: "물에 빠진 생쥐 꼴로 도착.\n동기가 묻는다. \"샤워하고 왔어?\" ...웃기냐." },
      { t: "비 그칠 때까지 카페에서 대기", d: { mental: 8, rep: -8 },
        r: "따뜻한 라떼와 함께하는 평화로운 아침.\n단, 30분 지각이라는 작은 문제가 있다." },
    ]},
  { slot: 0, text: "🐶 월요일 아침, 침대에서 몸이 떨어지지 않는다.\n'아... 회사 가기 싫다'는 생각이 머리를 가득 채운다.",
    choices: [
      { t: "'월급... 월급...' 주문을 외우며 일어난다", d: { mental: -3, rep: 3 },
        r: "통장에 스쳐 갈 월급을 생각하며 좀비처럼 기상.\n프로 직장인의 자세다." },
      { t: "5분만 더... (스누즈 3연타)", d: { hp: 5, rep: -6 },
        r: "5분이 25분이 되는 마법.\n아침밥은 포기했지만 꿀잠은 챙겼다." },
      { t: "로또 당첨 상상으로 현실도피", d: { mental: 7, hp: -2 },
        r: "사직서를 던지는 상상만으로 행복해졌다.\n상상 속에서 이미 3번 퇴사했다." },
    ]},
  { slot: 0, text: "🚗 버스에서 마침내 자리가 났다!\n그 순간, 어르신 한 분이 타셨다.",
    choices: [
      { t: "당연히 양보한다", d: { hp: -5, mental: 6, rep: 3 },
        r: "\"고마워요 총각/아가씨~\"\n다리는 아프지만 마음은 따뜻하다. 오늘 운세 좋을 듯." },
      { t: "자는 척한다", d: { mental: -8, hp: 5 },
        r: "눈을 감았지만 마음이 불편하다.\n내릴 때까지 눈을 못 떴다. 목만 아프다." },
    ]},
  { slot: 0, text: "📱 출근길 단톡방에 부장님 메시지.\n\"오늘 아침 회의 8시 반으로 당깁니다^^\"\n현재 시각 8시 20분.",
    choices: [
      { t: "\"네! 가고 있습니다!\" (전력질주)", d: { hp: -10, rep: 6 },
        r: "헐떡이며 도착하니 부장님 왈,\n\"회의 9시로 다시 미뤄졌어~\" ...실화냐." },
      { t: "메시지 못 본 척한다", d: { mental: 3, rep: -7 },
        r: "\"김대리 톡 안 봤어?\" \"아 지하철이라 신호가...\"\n읽음 표시는 이미 떠 있었다. 들켰다." },
    ]},

  /* ───── 오전 업무 ───── */
  { slot: 1, text: "📊 부장님이 부른다.\n\"어제 말한 보고서, 오늘 점심 전까지 가능하지?\"\n어제 그런 말을 들은 기억이 전혀 없다.",
    choices: [
      { t: "\"네, 알겠습니다!\" (영혼 갈아넣기)", d: { hp: -12, mental: -8, rep: 8 },
        r: "2시간 만에 보고서 완성. 나는 천재인가.\n부장님: \"음, 폰트가 좀 별로네.\" ...하..." },
      { t: "\"어제 말씀 안 하셨는데요?\" (팩트 체크)", d: { mental: 5, rep: -10 },
        r: "사무실에 정적이 흐른다.\n맞는 말이 항상 옳은 말은 아니라는 걸 배웠다." },
      { t: "\"네! 근데 어떤 보고서 말씀이실까요?\"", d: { mental: -3, rep: 3 },
        r: "공손한 되물음의 기술.\n부장님도 사실 뭘 시켰는지 기억 못 하는 눈치다." },
    ]},
  { slot: 1, text: "💻 모니터를 보는 척하며 멍때린 지 20분째.\n갑자기 뒤에서 인기척이 느껴진다.",
    choices: [
      { t: "황급히 엑셀 창을 띄운다", d: { mental: -5, rep: 2 },
        r: "Alt+Tab 신공 발동! 빈 엑셀이지만 일하는 각도다.\n심장이 벌렁거리지만 위기는 넘겼다." },
      { t: "당당하게 기지개를 켠다", d: { mental: 5, rep: -3 },
        r: "\"잠깐 생각 정리 중이었습니다.\"\n뻔뻔함도 실력이다. 부장님이 갸웃하며 지나간다." },
    ]},
  { slot: 1, text: "📧 메일함에 'RE:RE:RE:RE:RE: 긴급' 제목의 메일.\n참조에 임원 3명이 걸려 있다.",
    choices: [
      { t: "정독하고 정성껏 회신한다", d: { hp: -8, rep: 7 },
        r: "30분간 메일 하나에 영혼을 담았다.\n돌아온 답장: \"넵\" ...내 30분 돌려줘." },
      { t: "\"확인했습니다\"만 보낸다", d: { mental: 3, rep: -3 },
        r: "효율의 화신. 하지만 5분 뒤 전화가 온다.\n\"메일 확인했으면 의견을 줘야지~\"" },
      { t: "옆자리 동기에게 떠넘긴다", d: { mental: 6, hp: 3, rep: -6 },
        r: "\"이거 네 담당 아니야?\" 동기의 눈빛이 싸늘하다.\n오늘 점심은 내가 사야 할 것 같다." },
    ]},
  { slot: 1, text: "🖨️ 프린터가 또 말썽이다. 용지 걸림 7번째.\n10분 뒤 회의인데 자료 30부를 뽑아야 한다.",
    choices: [
      { t: "프린터와 맨손 격투를 벌인다", d: { hp: -7, mental: -7, rep: 5 },
        r: "토너 가루를 뒤집어쓰며 승리했다.\n손은 까매졌지만 자료는 지켰다. 오늘의 MVP." },
      { t: "총무팀에 SOS를 친다", d: { rep: -2, mental: 2 },
        r: "총무팀: \"그거 토너 갈면 돼요\" (1초 만에 해결)\n...나는 30분을 싸웠는데." },
      { t: "\"자료는 화면 공유로 하시죠!\" (기지 발휘)", d: { mental: 5, rep: 4 },
        r: "위기를 페이퍼리스 혁신으로 포장했다.\n부장님: \"오~ 요즘 친구다워\" 칭찬인가?" },
    ]},
  { slot: 1, text: "🗣️ 회의가 1시간째. 결론은 \"다음 회의에서 정하자\".\n그리고 누군가 말했다. \"근데 이거 원점에서 다시 보죠.\"",
    choices: [
      { t: "조용히 영혼을 분리한다", d: { mental: -6, hp: -3 },
        r: "몸은 회의실에, 영혼은 퇴근길에.\n회의록엔 '참석'으로 기록됐으니 됐다." },
      { t: "\"제가 정리해서 공유드릴게요\" (총대)", d: { hp: -8, rep: 9 },

    ]},
];

/* ── 칭호 테이블 (최종 점수 기준) ── */
const TITLES = [
  { min: 270, t: "전설의 직장인 🏆" },
  { min: 230, t: "워라밸 마스터 ⚖️" },
  { min: 190, t: "프로 월급루팡 🦹" },
  { min: 150, t: "버티기의 달인 🪨" },
  { min: 100, t: "월급의 노예 ⛓️" },
  { min: 0,   t: "이번 생은 직장인 😇" },
];

/* ── 게임 상태 ── */
let S = null;

function newState() {
  return {
    day: 0,          // 0~4 (월~금)
    slot: 0,         // 0~4
    mental: 70,
    hp: 70,
    rep: 60,
    used: new Set(), // 사용한 이벤트 인덱스
    current: null,   // 현재 이벤트
  };
}

const app = document.getElementById("app");
const clamp = (v) => Math.max(0, Math.min(100, v));
const bestKey = "office-survivor-best";

/* ── 타이틀 화면 ── */
function showTitle() {
  const best = localStorage.getItem(bestKey);
  app.innerHTML = `
    <div class="screen title-screen">
      <div class="title-emoji">🏢</div>
      <h1>직장인 생존기</h1>
      <div class="subtitle">월요일 출근부터 금요일 퇴근까지<br>당신의 일주일을 무사히 버텨내세요!</div>
      <div class="rules">
        🧠 <b>멘탈</b> — 바닥나면 홧김에 사직서를 던집니다<br>
        ⚡ <b>체력</b> — 바닥나면 번아웃으로 쓰러집니다<br>
        🤝 <b>사회생활</b> — 바닥나면 면담실로 불려갑니다<br>
        💰 금요일 퇴근까지 버티면 <b>월급날</b>이 옵니다!
      </div>
      ${best ? `<div class="best-record">🏅 최고 기록: ${best}점</div>` : ""}
      <button class="btn-primary" onclick="startGame()">출근하기</button>
      <div class="footer-tip">선택지는 키보드 1, 2, 3으로도 고를 수 있어요</div>
    </div>`;
}

function startGame() {
  S = newState();
  nextEvent();
}

/* ── 이벤트 선택 ── */
function pickEvent() {
  const pool = EVENTS
    .map((e, i) => ({ e, i }))
    .filter(({ e, i }) => e.slot === S.slot && !S.used.has(i));
  if (pool.length === 0) {
    // 풀이 비면 같은 슬롯 전체에서 재사용
    const all = EVENTS.map((e, i) => ({ e, i })).filter(({ e }) => e.slot === S.slot);
    return all[Math.floor(Math.random() * all.length)];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function nextEvent() {
  const picked = pickEvent();
  S.used.add(picked.i);
  S.current = picked.e;
  renderEvent();
}

/* ── HUD 렌더 ── */
function hudHTML() {
  const week = DAYS.map((d, i) => {
    const cls = i < S.day ? "done" : i === S.day ? "today" : "";
    return `<span class="${cls}">${d}</span>`;
  }).join("");

  const bars = Object.entries(STAT_META).map(([key, m]) => {
    const v = S[key];
    const low = v <= 25 ? "low" : "";
    return `
      <div class="stat">
        <div class="stat-label">
          <span>${m.emoji} ${m.name}</span><span class="val">${v}/100</span>
        </div>
        <div class="bar"><div class="bar-fill ${m.cls} ${low}" style="width:${v}%"></div></div>
      </div>`;
  }).join("");

  return `
    <div class="hud">
      <div class="hud-top">
        <span class="day-badge">${DAYS[S.day]}요일</span>
        <span class="time-badge">🕐 ${SLOT_TIMES[S.slot]} · ${SLOTS[S.slot]}</span>
      </div>
      <div class="week-track">${week}</div>
      ${bars}
    </div>`;
}

/* ── 이벤트 화면 ── */
function renderEvent() {
  const ev = S.current;
  const choices = ev.choices.map((c, i) => `
    <button class="choice-btn" onclick="choose(${i})">
      <span class="num">${i + 1}</span>${c.t}
    </button>`).join("");

  app.innerHTML = `
    <div class="screen">
      ${hudHTML()}
      <div class="event-card">
        <div class="event-slot">${SLOTS[S.slot].toUpperCase()}</div>
        <div class="event-text">${ev.text}</div>
        <div class="choices">${choices}</div>
      </div>
    </div>`;
}

/* ── 선택 처리 ── */
function choose(idx) {
  const c = S.current.choices[idx];
  const deltas = [];
  for (const [key, m] of Object.entries(STAT_META)) {
    const d = c.d[key] || 0;
    if (d !== 0) {
      S[key] = clamp(S[key] + d);
      deltas.push(`<span class="delta ${d > 0 ? "up" : "down"}">${m.emoji} ${m.name} ${d > 0 ? "+" : ""}${d}</span>`);
    }
  }

  app.innerHTML = `
    <div class="screen">
      ${hudHTML()}
      <div class="event-card">
        <div class="event-slot">결과</div>
        <div class="result-text">${c.r}</div>
        <div class="deltas">${deltas.join("") || '<span class="delta">변화 없음</span>'}</div>
        <button class="btn-next" onclick="advance()">계속하기 →</button>
      </div>
    </div>`;
}

/* ── 진행 / 게임오버 판정 ── */
function advance() {
  if (S.mental <= 0) return showEnding("burst");
  if (S.hp <= 0)     return showEnding("burnout");
  if (S.rep <= 0)    return showEnding("fired");

  S.slot++;
  if (S.slot >= SLOTS.length) {
    S.slot = 0;
    S.day++;
    if (S.day >= DAYS.length) return showEnding("payday");
  }
  nextEvent();
}

/* ── 엔딩 ── */
function showEnding(type) {
  const score = S.mental + S.hp + S.rep;
  const survived = type === "payday";

  const endings = {
    burst: {
      emoji: "📄", title: "멘탈 붕괴 퇴사",
      desc: "더는 참을 수 없었다.\n품속의 사직서가 부장님 책상 위로 날아갔다.\n\"그동안 감사했습니다!\"\n\n...3초간 짜릿했고, 카드값 알림과 함께 현실로 돌아왔다.",
    },
    burnout: {
      emoji: "🏥", title: "번아웃 — 강제 휴식",
      desc: "몸이 먼저 파업을 선언했다.\n눈을 떠 보니 링거를 맞고 있다.\n\n의사: \"과로입니다. 푹 쉬세요.\"\n부장님 문자: \"몸조리 잘하고~ 보고서는 메일로 부탁해^^\"",
    },
    fired: {
      emoji: "🚪", title: "면담실로 오세요",
      desc: "인사팀에서 호출이 왔다.\n\"요즘 팀 분위기에 대해 얘기 좀 할까요?\"\n\n사회생활도 실력이라는 걸\n뼈저리게 배운 한 주였다.",
    },
    payday: {
      emoji: "💰", title: "월급날 생존 성공!",
      desc: "금요일 오후 6시, 무사히 한 주를 버텨냈다.\n그리고 도착한 문자 한 통.\n\n[입금] 급여 ***원\n\n통장을 스쳐 가는 월급마저 아름다운 밤이다.\n다음 주도... 버텨보자.",
    },
  };

  // 고득점 생존 시 특별 엔딩
  let e = endings[type];
  if (survived && score >= 240) {
    e = {
      emoji: "👑", title: "이달의 우수사원",
      desc: "멘탈, 체력, 사회생활 모두 지켜낸 완벽한 한 주!\n부장님: \"김대리, 자네 같은 인재는 처음이야.\"\n\n...라는 칭찬과 함께 일이 2배로 늘었다.\n유능함의 저주란 이런 것이다.",
    };
  }

  const title = survived
    ? TITLES.find(x => score >= x.min).t
    : "중도 하차 😵";

  let recordHTML = "";
  if (survived) {
    const best = Number(localStorage.getItem(bestKey) || 0);
    if (score > best) {
      localStorage.setItem(bestKey, String(score));
      recordHTML = `<div class="new-record">🎉 신기록 달성!</div>`;
    }
  }

  app.innerHTML = `
    <div class="screen ending-screen">
      <div class="ending-emoji">${e.emoji}</div>
      <div class="ending-title">${e.title}</div>
      <div class="ending-desc">${e.desc}</div>
      <div class="score-box">
        <div class="label">최종 점수 (멘탈+체력+사회생활)</div>
        <div class="score">${score}점</div>
        <div class="title-earned">칭호: ${title}</div>
      </div>
      ${recordHTML}
      <button class="btn-primary" onclick="startGame()">다시 출근하기</button>
      <div class="footer-tip">버티는 모든 직장인을 응원합니다 🙌</div>
    </div>`;
}

/* ── 키보드 입력 (1/2/3 선택, Enter 진행) ── */
document.addEventListener("keydown", (ev) => {
  if (ev.key >= "1" && ev.key <= "3") {
    const btns = document.querySelectorAll(".choice-btn");
    const i = Number(ev.key) - 1;
    if (btns[i]) btns[i].click();
  } else if (ev.key === "Enter") {
    const next = document.querySelector(".btn-next") || document.querySelector(".btn-primary");
    if (next) next.click();
  }
});

showTitle();
</script>
</body>
</html>
