services:
  postgres:
    image: postgres:16-alpine
    container_name: amc-postgres
    environment:
      POSTGRES_USER: amc
      POSTGRES_PASSWORD: amc_dev_password
      POSTGRES_DB: amc_dev
    ports:
      - '5432:5432'
    volumes:
      - amc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amc -d amc_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: amc-redis
    ports:
      - '6379:6379'
    volumes:
      - amc-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: amc-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: amc_minio
      MINIO_ROOT_PASSWORD: amc_minio_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - amc-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  amc-postgres-data:
  amc-redis-data:
  amc-minio-data:
