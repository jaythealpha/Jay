<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<title>Event</title>
<style>
  :root{--acc:#ff4d8d;--bg:#0b0d12;--card:#ffffff;--txt:#14161c;--mut:#6b7080}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Noto Sans JP","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;min-height:100dvh}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex}
  /* landing */
  #land{align-items:center;justify-content:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 60%),var(--bg)}
  .brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
  h1{font-size:30px;line-height:1.2;margin:0 0 10px;word-break:keep-all}
  .sub{font-size:15px;opacity:.85;margin:0 0 6px;word-break:keep-all}
  .tag{display:inline-block;margin-top:6px;font-weight:700;color:var(--acc)}
  .teaser{margin:22px auto 0;max-width:340px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5}
  .btn{appearance:none;border:0;border-radius:999px;padding:16px 22px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.main{background:var(--acc);color:#fff;width:100%;max-width:340px;margin-top:26px;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 45%,transparent)}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);width:100%;max-width:340px;margin-top:10px;font-size:15px;padding:13px 18px}
  .fine{font-size:12px;opacity:.55;margin-top:18px;max-width:340px;line-height:1.5}
  /* camera */
  #cam{position:relative;background:#000}
  #stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #view{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
  video{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .bar{display:flex;align-items:center;justify-content:space-around;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#000}
  .round{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
  .shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:var(--acc);cursor:pointer}
  .hintbar{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;font-size:14px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);padding:0 16px}
  #count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:900;text-shadow:0 4px 30px rgba(0,0,0,.5)}
  /* result + sheet */
  #res{padding:16px 16px calc(16px + env(safe-area-inset-bottom));align-items:center}
  #shot{max-width:100%;max-height:62dvh;border-radius:14px;display:block;margin:4px auto 14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .row{display:flex;gap:10px;width:100%;max-width:420px}
  .row .btn{flex:1;font-size:15px;padding:14px 10px}
  .sheet{width:100%;max-width:420px;background:var(--card);color:var(--txt);border-radius:20px;padding:20px 18px;margin-top:14px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  .sheet .big{font-size:40px;line-height:1}
  .sheet h2{margin:8px 0 4px;font-size:22px;word-break:keep-all}
  .sheet p{margin:4px 0;color:var(--mut);font-size:14px;word-break:keep-all}
  .code{display:inline-block;margin:10px 0 4px;padding:10px 16px;border:2px dashed var(--acc);border-radius:12px;font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--txt)}
  .stamp{font-size:12px;color:var(--mut);margin-top:8px}
  .sheet .btn.main{margin-top:14px}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
  #panel{position:absolute;left:12px;right:12px;bottom:12px;display:none;justify-content:center}
  #panel .sheet{margin:0}
  .sheetwrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
  .sheet{position:relative}
  .sheet .x{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:18px;color:var(--mut);cursor:pointer;padding:6px}
  .sheet-note{font-size:13px;color:#fff;margin-bottom:6px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .code.void{text-decoration:line-through;opacity:.5}
  .used{margin-top:10px;padding:10px 12px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:800}
  .btn.staff{color:var(--txt);border-color:#d1d5db;margin-top:10px;font-size:14px;padding:10px 14px}
  .err{color:#fca5a5;font-size:14px;margin-top:14px;max-width:340px}
</style>
</head>
<body>
<section class="screen on" id="land">
  <div class="brand" id="lBrand"></div>
  <h1 id="lTitle"></h1>
  <p class="sub" id="lSub"></p>
  <div class="tag" id="lTag"></div>
  <div class="teaser" id="lTeaser" style="display:none"></div>
  <button class="btn main" id="go"></button>
  <button class="btn ghost" id="noCam"></button>
  <a class="btn ghost" id="lLink" style="display:none;text-decoration:none;box-sizing:border-box" target="_blank" rel="noopener"></a>
  <div class="err" id="err" style="display:none"></div>
  <div class="fine" id="lFine"></div>
</section>

<section class="screen" id="cam">
  <div id="stage"><canvas id="view"></canvas><div class="hintbar" id="cHint"></div><div id="count"></div><div id="panel"></div><button id="reopen" class="btn main" style="display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:auto;max-width:none;margin:0;padding:12px 20px;font-size:15px"></button></div>
  <video id="vid" playsinline muted autoplay></video>
  <div class="bar">
    <button class="round" id="back" aria-label="Back">←</button>
    <button class="shutter" id="snap" aria-label="Shutter"></button>
    <button class="round" id="flip" aria-label="Flip">⟲</button>
  </div>
</section>

<section class="screen" id="res">
  <img id="shot" alt="" />
  <div class="row"><button class="btn main" id="save" style="margin:0"></button><button class="btn ghost" id="share" style="margin:0"></button></div>
  <button class="btn ghost" id="again"></button>
  <div id="reward"></div>
</section>

<script src="vendor/jsQR.js"></script>

    if(KIND==="confetti" && tracked){ if(!loopScan.next || now>loopScan.next){ launch(P); loopScan.next=now+(el<1500?300:850); } }
    if(KIND==="lucky" && resultWin && el>2250 && !loopScan.coin){ loopScan.coin=1; var sv=PE; PE=PE||"🪙"; burst(P.cx,P.cy-P.s*1.3,60,11,20); PE=sv; if(navigator.vibrate) navigator.vibrate([60,40,120]); }
    if(KIND==="coupon" && el>620 && !loopScan.pop){ loopScan.pop=1; burst(P.cx,P.cy-P.s*1.15,50,9); if(navigator.vibrate) navigator.vibrate(40); }
  }
  stepRockets(dt); stepParts(dt);
  if(revealed && !sheetShown && now-revealAt>SETTLE[KIND]+(KIND==="info"?700:0) && !DEMO){ sheetShown=true; showPanel(prize?prize.again:false); }
  raf=requestAnimationFrame(loopScan); }
// ---------- event settings that work without a server ----------
function hsh(s){ var h=2166136261; s=String(s); for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(16); }
var EVKEY="ev_"+hsh(raw||"x");
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(EVKEY+k); localStorage.setItem(EVKEY+k,v); }catch(e){ return null; } }
// lucky draw: up to 3 prize tiers [[name, %], …] (falls back to a single prize p / wx); one result per device
function luckyResult(){ var prev=store("_lucky"); if(prev){ try{ var o=JSON.parse(prev); o.again=true; return o; }catch(e){} }
  var tiers=Array.isArray(C.pr)&&C.pr.length?C.pr:[[C.wx||T.win,+C.p||20]], r=Math.random()*100, acc=0, res={win:false,i:-1,name:""};
  for(var i=0;i<tiers.length;i++){ acc+=Math.max(0,+tiers[i][1]||0); if(r<acc){ res={win:true,i:i,name:String(tiers[i][0]||"")}; break; } }
  store("_lucky",JSON.stringify(res)); res.again=false; return res; }
// staff redemption: PIN check (hashed in the link) marks the reward as used on this phone
function usedAt(){ return store("_used"); }
window.__closeSheet=function(btn){ var sh=btn.closest(".sheet"); if($("panel").contains(sh)){ $("panel").style.display="none"; $("reopen").style.display="block"; } else sh.style.display="none"; };
window.__redeem=function(){ if(!C.pn) return; var pin=prompt(T.pinAsk); if(pin==null) return;
  if(hsh(String(pin).trim()+"|"+(C.t||""))!==C.pn){ alert(T.pinWrong); return; }
  store("_used",new Date().toLocaleString()); if(navigator.vibrate) navigator.vibrate([40,30,40]);
  document.querySelectorAll(".sheet[data-rw]").forEach(function(el){ el.outerHTML=rewardSheet(el.getAttribute("data-rw")); }); };
function redeemBlock(){ var u=usedAt();
  if(u) return '<div class="used">✅ '+esc(T.used)+' · '+esc(u)+'</div>';
  return '<p>'+esc(T.showStaff)+'</p><div class="stamp">'+esc(new Date().toLocaleString())+'</div>'+(C.pn?'<button class="btn ghost staff" onclick="__redeem()">'+esc(T.pinBtn)+'</button>':''); }
function codeBlock(){ return C.rd?'<div class="code'+(usedAt()?' void':'')+'">'+esc(C.rd)+'</div>':''; }
function linkBtn(){ return C.l?'<a class="btn main" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="'+esc(safeUrl(C.l))+'">'+esc(C.lt||T.open)+'</a>':''; }
function rewardSheet(kind){ var h='';
  if(kind==="coupon"||kind==="photo") h='<div class="big">'+esc(C.ic||"🎁")+'</div><h2>'+esc(C.rx||"")+'</h2>'+codeBlock()+(C.ru?'<p>'+esc(T.until)+' · '+esc(C.ru)+'</p>':'')+redeemBlock();
  else if(kind==="lucky") h='<div class="big">🎉</div><h2>'+esc((prize&&prize.name)||C.wx||T.win)+'</h2>'+codeBlock()+(C.ru?'<p>'+esc(T.until)+' · '+esc(C.ru)+'</p>':'')+redeemBlock();
  return '<div class="sheet" data-rw="'+kind+'"><button class="x" onclick="__closeSheet(this)">✕</button>'+h+linkBtn()+'</div>'; }
// bottom sheet with the details (also used without a camera)
function sheetHTML(again){
  if(KIND==="coupon") return rewardSheet("coupon");
  if(KIND==="lucky"){ if(resultWin) return (again?'<div class="sheet-note">'+esc(T.already)+'</div>':'')+rewardSheet("lucky");
    return '<div class="sheet">'+(again?'<p>'+esc(T.already)+'</p>':'')+'<div class="big">🍀</div><h2>'+esc(C.lx||T.lose)+'</h2>'+linkBtn()+'</div>'; }
  if(KIND==="info") return '<div class="sheet"><div class="big">'+esc(C.ic||"ℹ️")+'</div><h2>'+esc(C.it||C.t||T.infoTitle)+'</h2>'+String(C.i||"").split("|").filter(Boolean).map(function(l){return '<p>'+esc(l)+'</p>';}).join("")+linkBtn()+'</div>';
  return '<div class="sheet"><div class="big">🎉</div><h2>'+esc(C.t||"")+'</h2>'+(C.s?'<p>'+esc(C.s)+'</p>':'')+linkBtn()+'</div>'; }
function showPanel(again){ var p=$("panel");
  if(KIND==="scene"){ if(C.l){ p.innerHTML='<a class="btn main" style="display:block;text-decoration:none;max-width:320px" target="_blank" rel="noopener" href="'+esc(safeUrl(C.l))+'">'+esc(C.lt||T.open)+'</a>'; p.style.display="flex"; } return; } p.innerHTML='<div class="sheetwrap">'+sheetHTML(again)+'</div>'; p.style.display="flex"; }
function onReveal(){ if(navigator.vibrate) navigator.vibrate(50); $("cHint").textContent=T.found; if(!sheetShown){ $("panel").innerHTML=""; $("panel").style.display="none"; }
  loopScan.pop=0; loopScan.coin=0; loopScan.next=0;
  if(KIND==="lucky" && !DEMO){ var r=luckyResult(); resultWin=r.win; prize=r; } }
// ---------- demo mode (?demo=1): used by the builder's live preview ----------
var QP=new URLSearchParams(location.search), DEMO=QP.get("demo")==="1", demoImg=null;
function drawDemo(W,H){ var iw=demoImg.naturalWidth, ih=demoImg.naturalHeight, s=Math.max(W/iw,H/ih); g.drawImage(demoImg,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s); }
if(DEMO){
  document.body.style.minHeight="100%";
  show("cam"); $("cHint").textContent=T.sample||""; document.querySelector(".bar").style.display="none";
  demoImg=new Image(); demoImg.onload=function(){
    if(isPhoto){ cv.width=1080; cv.height=1350; }
    else { cv.width=demoImg.naturalWidth; cv.height=demoImg.naturalHeight; var cvh=document.createElement("canvas"); }
    var st=$("stage").getBoundingClientRect(), r=Math.min(st.width/cv.width, st.height/cv.height); cv.style.width=Math.floor(cv.width*r)+"px"; cv.style.height=Math.floor(cv.height*r)+"px";
    if(isPhoto){ (function lp(tm){ var W=cv.width,H=cv.height; drawDemo(W,H); drawFrame(W,H,tm); requestAnimationFrame(lp); })(0); }
    else { var bw=cv.width*0.36, bx=cv.width*0.32, by=cv.height*0.6; Q=[{x:bx,y:by},{x:bx+bw,y:by},{x:bx+bw,y:by+bw},{x:bx,y:by+bw}]; seen=1e15;
      if(KIND==="lucky"){ resultWin=true; prize={i:0,name:(Array.isArray(C.pr)&&C.pr[0]?C.pr[0][0]:C.wx)||T.win}; }
      requestAnimationFrame(loopScan);
      setInterval(function(){ revealAt=performance.now(); loopScan.pop=0; loopScan.coin=0; loopScan.next=0; parts.length=0; rockets.length=0; },5600); }
  };
  demoImg.src=QP.get("bg")||(isPhoto?"assets/poster/poster-13.webp":"assets/poster/poster-01.webp");
}
if(isPage){ var holder=document.createElement("div"); holder.className="sheetwrap"; holder.style.marginTop="20px"; holder.innerHTML=sheetHTML(false); $("lTeaser").after(holder); }
// ---------- flow ----------
$("go").addEventListener("click",async function(){ $("err").style.display="none"; show("cam"); if(!(await startCam())) return; sizeCanvas();
  $("cHint").textContent=isPhoto?T.hintPhoto:T.hintScan; $("snap").style.display=isPhoto?"block":"none"; $("flip").style.visibility="visible";
  if(isPhoto){ initFace(); raf=requestAnimationFrame(loopPhoto); } else { revealed=false; Q=null; vis=0; lostAt=0; sheetShown=false; parts.length=0; rockets.length=0; $("reopen").style.display="none"; scanStart=0; $("panel").innerHTML=""; $("panel").style.display="none"; $("cHint").textContent=T.hintScan; raf=requestAnimationFrame(loopScan); } });
$("noCam").addEventListener("click",function(){ var again=false; if(KIND==="lucky"){ var r=luckyResult(); resultWin=r.win; prize=r; again=r.again; } sheetShown=true; show("cam"); $("stage").style.background=getComputedStyle(document.body).backgroundColor; cv.width=cv.height=1; $("cHint").textContent=""; $("snap").style.display="none"; $("flip").style.visibility="hidden"; showPanel(again); });
$("back").addEventListener("click",function(){ stopCam(); show("land"); });
$("flip").addEventListener("click",async function(){ facing=facing==="user"?"environment":"user"; await startCam(); sizeCanvas(); if(isPhoto) raf=requestAnimationFrame(loopPhoto); else raf=requestAnimationFrame(loopScan); });
window.addEventListener("resize",function(){ if(stream) sizeCanvas(); });
var lastBlob=null;
function countdown(n){ return new Promise(function(res){ var c=$("count"); c.style.display="flex"; (function tick(){ if(n<=0){ c.style.display="none"; return res(); } c.textContent=n; n--; setTimeout(tick,700); })(); }); }
$("snap").addEventListener("click",async function(){ await countdown(3);
  var fl=document.createElement("div"); fl.style.cssText="position:fixed;inset:0;background:#fff;opacity:.9;transition:opacity .35s;z-index:9"; document.body.appendChild(fl); setTimeout(function(){ fl.style.opacity=0; setTimeout(function(){fl.remove();},400); },40);
  cv.toBlob(function(b){ lastBlob=b; $("shot").src=URL.createObjectURL(b); stopCam(); show("res"); $("reward").innerHTML="";
    if(C.rm==="capture") $("reward").innerHTML=rewardSheet("photo"); },"image/jpeg",0.92); });
$("reopen").textContent=T.mine; $("reopen").addEventListener("click",function(){ $("panel").style.display="flex"; this.style.display="none"; });
$("save").textContent=T.saveP; $("share").textContent=T.share; $("again").textContent=T.again;
$("save").addEventListener("click",function(){ if(!lastBlob) return; var a=document.createElement("a"); a.href=URL.createObjectURL(lastBlob); a.download=(C.b||"photo").replace(/[^\w가-힣-]+/g,"_")+".jpg"; document.body.appendChild(a); a.click(); a.remove(); });
$("share").addEventListener("click",async function(){ if(!lastBlob) return; var tag=C.h?("#"+String(C.h).replace(/^#/,"")):""; var file=new File([lastBlob],"photo.jpg",{type:"image/jpeg"});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:[C.t,tag].filter(Boolean).join(" ")}); }
       else if(navigator.share){ await navigator.share({text:[C.t,tag].filter(Boolean).join(" "),url:location.href}); }
       else { $("save").click(); }
       if(C.rm==="share") $("reward").innerHTML=rewardSheet("photo"); }catch(e){} });
$("again").addEventListener("click",function(){ $("go").click(); });
})();
