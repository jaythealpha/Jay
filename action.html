<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>Action QR</title>
<style>
  :root{--acc:#ff4d8d;--bg:#f6f6f4;--card:#ffffff;--txt:#14161c;--mut:#6b7080;--line:#e6e6e2;--warn:#fff7e6}
  @media (prefers-color-scheme: dark){ :root{--bg:#0f1115;--card:#181b22;--txt:#f3f4f6;--mut:#9aa1b0;--line:#2a2e38;--warn:#2b2108} }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Noto Sans JP","Noto Sans SC",sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  main{width:100%;max-width:440px}
  .top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--acc);flex:none}
  .top h1{font-size:19px;margin:0;font-weight:800;word-break:keep-all;flex:1}
  .owner{display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px}
  .owner{flex-wrap:wrap} .owner b{font-weight:800;margin-right:auto} .owner a,.owner button{white-space:nowrap;font-size:13px;color:var(--txt);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;text-decoration:none;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin-bottom:12px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  .card h2{margin:0 0 8px;font-size:22px;line-height:1.3;word-break:keep-all}
  .card p{margin:6px 0;color:var(--mut);font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  .card img.hero{width:100%;border-radius:14px;display:block;margin:0 0 12px;background:var(--bg)}
  .big{font-size:44px;line-height:1;margin-bottom:10px}
  .btn{display:block;width:100%;text-align:center;appearance:none;border:0;border-radius:999px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;margin-top:12px}
  .btn.main{background:var(--acc);color:#fff}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .row{display:flex;gap:8px} .row .btn{flex:1}
  input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);margin-top:10px}
  textarea{min-height:90px;resize:vertical}
  .muted{color:var(--mut);font-size:13px;line-height:1.5}
  .warn{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:10px}
  .err{color:#ef4444;font-size:14px;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .item{background:var(--bg);border-radius:12px;overflow:hidden;font-size:13px}
  .item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .item div{padding:8px 10px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere} .item small{display:block;color:var(--mut);margin-top:4px}
  .grid.one{grid-template-columns:1fr} .grid.one .item img{aspect-ratio:auto}
  .timer{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:center;margin:10px 0}
  .units{display:flex;justify-content:center;gap:14px;margin:12px 0} .units div{text-align:center} .units b{display:block;font-size:34px;font-variant-numeric:tabular-nums} .units span{font-size:12px;color:var(--mut)}
  .kv{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px} .kv span{color:var(--mut);font-size:12px;min-width:64px} .kv b{flex:1;overflow-wrap:anywhere} .kv button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
  .preview{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--mut)}
  #focus{position:fixed;inset:0;background:#0b0d12;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:5}
  #focus .timer{font-size:68px} #focus p{color:rgba(255,255,255,.7);max-width:320px;line-height:1.6} #focus .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3);max-width:320px}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--mut)} .foot a{color:var(--mut)}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <div class="owner" id="owner"></div>
  <div id="out"><div class="spin"></div></div>
  <div class="foot"><a href="/" id="made">Aesthetic QR Studio</a></div>
</main>

function card(h){ return '<div class="card">'+h+'</div>'; }

function runActions(run){ var box=$("acts"); run.do.forEach(function(a,i){ var el=document.createElement("div"); box.appendChild(el); (ACT[a.a]||function(){})(a,el,run,i); }); }
var ACT={
  show:function(a,el){ el.innerHTML=card((a.img?'<img class="hero" src="'+esc(a.img)+'" alt="">':'')+(a.title?'<h2>'+esc(a.title)+'</h2>':'')+(a.body?'<p>'+esc(a.body)+'</p>':'')+(a.url?'<a class="btn main" href="'+esc(safeUrl(a.url))+'" target="_blank" rel="noopener">'+esc(a.label||T.go)+'</a>':'')); },
  link:function(a,el,run){ var u=safeUrl(a.url); el.innerHTML=card((a.title?'<h2>'+esc(a.title)+'</h2>':'')+'<a class="btn main" href="'+esc(u)+'" rel="noopener">'+esc(a.label||T.go)+'</a>'+(run.do.length===1&&!PREVIEW&&DEF.who!=="owner"?'<p class="muted" style="text-align:center">'+esc(T.redirect)+'</p>':''));
    if(run.do.length===1 && !PREVIEW && DEF.who!=="owner") setTimeout(function(){ location.href=u; },1500); },
  "vault.add":function(a,el,run){ var shared=a.scope==="shared";
    el.innerHTML=card('<div class="big">📦</div><h2>'+esc(a.title||T.addT)+'</h2>'+(a.body?'<p>'+esc(a.body)+'</p>':'')+'<p class="muted">'+esc(shared?T.shared:T.deviceOnly)+'</p>'+
      '<div class="row"><label class="btn ghost" style="margin-top:12px">'+esc(T.cam)+'<input type="file" accept="image/*" capture="environment" hidden data-f></label><label class="btn ghost" style="margin-top:12px">'+esc(T.album)+'<input type="file" accept="image/*" hidden data-f></label></div>'+
      '<img class="hero" data-pv style="display:none;margin-top:12px"><textarea data-t placeholder="'+esc(T.addPh)+'" maxlength="500"></textarea><button class="btn main" data-s>'+esc(T.save)+'</button><div class="err" data-e></div>');
    var img=null; el.querySelectorAll("[data-f]").forEach(function(f){ f.onchange=function(){ var file=f.files&&f.files[0]; if(!file) return; shrink(file,1280).then(function(d){ img=d; var p=el.querySelector("[data-pv]"); p.src=d; p.style.display="block"; }); }; });
    el.querySelector("[data-s]").onclick=function(){ var b=this, txt=el.querySelector("[data-t]").value.trim(), e=el.querySelector("[data-e]"); if(!img&&!txt){ e.textContent=T.needOne; return; }
      b.disabled=true; b.textContent=T.saving; e.textContent="";
      var p=shared? api({op:"vault.add",id:ID,key:KEY||undefined,dev:DEV,ctx:CTX,ri:run.ri,text:txt,data:img||undefined}).then(function(d){ if(!d.ok) throw d; })
                  : idbAdd({q:ID,img:img,text:txt,at:Date.now()});
      p.then(function(){ b.textContent="✓ "+T.saved; setTimeout(function(){ b.disabled=false; b.textContent=T.save; },1600); el.querySelector("[data-t]").value=""; img=null; el.querySelector("[data-pv]").style.display="none";
        if(!el.querySelector("[data-l]")){ var l=document.createElement("button"); l.className="btn ghost"; l.setAttribute("data-l",""); l.textContent=T.showAll; l.onclick=function(){ var v=document.createElement("div"); el.after(v); ACT["vault.show"]({scope:a.scope,mode:"all",_from:run.ri},v,run); l.remove(); }; el.querySelector(".card").appendChild(l); } })
       .catch(function(){ b.disabled=false; b.textContent=T.save; e.textContent=T.err; }); }; },
  "vault.show":function(a,el,run){ var shared=a.scope==="shared"; el.innerHTML=card('<div class="big">🗂️</div><h2>'+esc(a.title||T.showAll)+'</h2>'+(a.body?'<p>'+esc(a.body)+'</p>':'')+'<div class="spin"></div>');
    var p=shared? api({op:"vault.list",id:ID,key:KEY||undefined,dev:DEV,ctx:CTX,ri:a._from!=null?a._from:run.ri}).then(function(d){ return d.items||[]; }) : idbList(ID);
    p.then(function(items){ items.sort(function(x,y){ return y.at-x.at; });
      if(a.mode==="latest") items=items.slice(0,1); else if(a.mode==="random" && items.length) items=[items[Math.floor(Math.random()*items.length)]];
      var c=el.querySelector(".card"), sp=c.querySelector(".spin"); sp.remove();
      if(!items.length){ c.insertAdjacentHTML("beforeend",'<p class="muted">'+esc(T.empty)+'</p>'); return; }
      c.insertAdjacentHTML("beforeend",'<div class="grid'+(items.length===1?' one':'')+'">'+items.map(function(it){ return '<div class="item">'+(it.img?'<img src="'+esc(it.img)+'" alt="" loading="lazy">':'')+'<div>'+esc(it.text||"")+'<small>'+esc(new Date(it.at).toLocaleString(L))+'</small></div></div>'; }).join("")+'</div>');
    }).catch(function(){ el.querySelector(".card").insertAdjacentHTML("beforeend",'<p class="err">'+esc(T.err)+'</p>'); }); },
  countdown:function(a,el){ var to=Date.parse(a.to);
    el.innerHTML=card('<div class="big">🎁</div><h2>'+esc(a.msg||a.title||T.until)+'</h2><p class="muted">'+esc(T.until)+'</p><div class="units" data-u></div>');
    var u=el.querySelector("[data-u]");
    (function tick(){ var ms=to-Date.now(); if(!(ms>0)){ u.innerHTML='<b>'+esc(T.opened)+'</b>'; u.insertAdjacentHTML("afterend",'<button class="btn main" onclick="location.reload()">'+esc(T.reload)+'</button>'); return; }
      var d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
      u.innerHTML=[[d,T.d],[h,T.h],[m,T.m],[s,T.s]].map(function(x){ return '<div><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>'; }).join(""); setTimeout(tick,1000); })(); },
  "focus.start":function(a,el){ var f=focusState();
    if(f && f.until>Date.now()){ showFocus(); el.innerHTML=""; return; }
    el.innerHTML=card('<div class="big">📵</div><h2>'+esc(a.title||T.focusT)+'</h2><p>'+esc(a.body||T.focusP)+'</p><p class="muted">'+esc(T.focusPledge)+'</p><button class="btn main" data-g>'+esc(T.focusB.replace("{m}",a.min||30))+'</button>'+(focusCount()?'<p class="muted" style="text-align:center">'+esc(T.streak.replace("{n}",focusCount()))+'</p>':''));
    el.querySelector("[data-g]").onclick=function(){ if(PREVIEW) return; store("aq_focus",JSON.stringify({until:Date.now()+(a.min||30)*6e4,start:Date.now(),q:ID,title:a.title||T.focusT})); showFocus(); }; },
  "focus.end":function(a,el){ var f=focusState();
    if(f && f.until>Date.now()){ if(!PREVIEW){ store("aq_focus",null); logFocus(); } el.innerHTML=card('<div class="big">🔓</div><h2>'+esc(T.focusEnd)+'</h2><p class="muted">'+esc(T.streak.replace("{n}",focusCount()))+'</p>'); }
    else el.innerHTML=card('<div class="big">🔓</div><h2>'+esc(a.title||T.noFocus)+'</h2>'+(a.body?'<p>'+esc(a.body)+'</p>':'')); },
  wifi:function(a,el){ el.innerHTML=card('<div class="big">📶</div><h2>'+esc(a.title||T.wifiT)+'</h2>'+kvRow(T.ssid,a.ssid)+(a.pw?kvRow(T.pw,a.pw):'')+'<p class="muted">'+esc(T.wifiH)+'</p>'); wireCopy(el); },
  contact:function(a,el){ var v=["BEGIN:VCARD","VERSION:3.0","FN:"+(a.name||""),a.org?"ORG:"+a.org:"",a.tel?"TEL;TYPE=CELL:"+a.tel:"",a.email?"EMAIL:"+a.email:"",a.url?"URL:"+a.url:"","END:VCARD"].filter(Boolean).join("\r\n");
    el.innerHTML=card('<div class="big">👤</div><h2>'+esc(a.name||"")+'</h2>'+(a.org?'<p>'+esc(a.org)+'</p>':'')+'<a class="btn main" href="'+dataUrl(v,"text/vcard")+'" download="'+esc((a.name||"contact").replace(/[\\/:*?"<>|]+/g,"_"))+'.vcf">'+esc(T.contactSave)+'</a>'+
      '<div class="row">'+(a.tel?'<a class="btn ghost" href="tel:'+esc(a.tel)+'">'+esc(T.call)+'</a>':'')+(a.email?'<a class="btn ghost" href="mailto:'+esc(a.email)+'">'+esc(T.mail)+'</a>':'')+'</div>'); },
  calendar:function(a,el){ var s=Date.parse(a.start), e=Date.parse(a.end)||(s+36e5), z=function(t){ return new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); };
    var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Aesthetic QR Studio//Action QR//EN","BEGIN:VEVENT","UID:"+ID+"-"+s+"@aqr","DTSTAMP:"+z(Date.now()),"DTSTART:"+z(s),"DTEND:"+z(e),"SUMMARY:"+(a.title||""),a.place?"LOCATION:"+a.place:"",a.body?"DESCRIPTION:"+String(a.body).replace(/\n/g,"\\n"):"","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
    var g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(a.title||"")+"&dates="+z(s)+"/"+z(e)+"&location="+encodeURIComponent(a.place||"")+"&details="+encodeURIComponent(a.body||"");
    el.innerHTML=card('<div class="big">📅</div><h2>'+esc(a.title||"")+'</h2><p>'+esc(isNaN(s)?"":new Date(s).toLocaleString(L))+(a.place?"\n📍 "+esc(a.place):"")+'</p>'+(a.body?'<p class="muted">'+esc(a.body)+'</p>':'')+
      '<a class="btn main" href="'+dataUrl(ics,"text/calendar")+'" download="event.ics">'+esc(T.calAdd)+'</a><a class="btn ghost" href="'+esc(g)+'" target="_blank" rel="noopener">'+esc(T.calG)+'</a>'); }
};
function kvRow(k,v){ return '<div class="kv"><span>'+esc(k)+'</span><b>'+esc(v)+'</b><button data-c="'+esc(v)+'">'+esc(T.copy)+'</button></div>'; }
function wireCopy(el){ el.querySelectorAll("[data-c]").forEach(function(b){ b.onclick=function(){ var v=b.getAttribute("data-c"); (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){ b.textContent=T.copied; },function(){ prompt("",v); }); }; }); }
function dataUrl(txt,type){ return "data:"+type+";charset=utf-8,"+encodeURIComponent(txt); }

// ---------- focus (pledge timer; real app blocking comes with the native app) ----------
function focusState(){ try{ return JSON.parse(store("aq_focus")||"null"); }catch(e){ return null; } }
function focusCount(){ return parseInt(store("aq_focus_n")||"0",10)||0; }
function logFocus(){ store("aq_focus_n",String(focusCount()+1)); }
var wake=null;
function showFocus(){ var f=focusState(), box=$("focus"); if(!f) return; box.style.display="flex";
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){ wake=w; }).catch(function(){}); }catch(e){}
  box.innerHTML='<div class="big">📵</div><div style="font-size:15px;opacity:.75">'+esc(f.title||T.focusOn)+'</div><div class="timer" id="ft"></div><p>'+esc(T.focusP)+'</p><button class="btn ghost" id="fq">'+esc(T.giveUp)+'</button>';
  $("fq").onclick=function(){ if(confirm(T.giveUpQ)){ store("aq_focus",null); box.style.display="none"; if(wake) wake.release(); location.reload(); } };
  (function tick(){ var ms=f.until-Date.now(); if(ms<=0){ store("aq_focus",null); logFocus(); if(wake) wake.release(); box.innerHTML='<div class="big">🎉</div><div class="timer" style="font-size:34px">'+esc(T.focusDone)+'</div><p>'+esc(T.streak.replace("{n}",focusCount()))+'</p><button class="btn ghost" onclick="location.reload()">OK</button>'; return; }
    var m=Math.floor(ms/6e4), s=Math.floor(ms/1e3)%60; $("ft").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; setTimeout(tick,500); })(); }

// ---------- images & this-phone-only vault (IndexedDB) ----------
function shrink(file,max){ return new Promise(function(res,rej){ var u=URL.createObjectURL(file), im=new Image(); im.onload=function(){ var k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); var d=c.toDataURL("image/webp",0.85); if(d.indexOf("data:image/webp")!==0) d=c.toDataURL("image/jpeg",0.85); res(d); }; im.onerror=rej; im.src=u; }); }
function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open("aq",1); r.onupgradeneeded=function(){ var s=r.result.createObjectStore("vault",{keyPath:"k",autoIncrement:true}); s.createIndex("q","q"); }; r.onsuccess=function(){ res(r.result); }; r.onerror=rej; }); }
function idbAdd(item){ return idb().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction("vault","readwrite"); tx.objectStore("vault").add(item); tx.oncomplete=res; tx.onerror=rej; }); }); }
function idbList(q){ return idb().then(function(db){ return new Promise(function(res,rej){ var r=db.transaction("vault").objectStore("vault").index("q").getAll(q); r.onsuccess=function(){ res(r.result||[]); }; r.onerror=rej; }); }); }

// a running focus session takes over whichever QR page is open (the unlock QR still evaluates normally)
var fs=focusState(); if(fs && fs.until<=Date.now()){ store("aq_focus",null); logFocus(); fs=null; }
scan();
})();
</script>
