# Global runtime settings. Secrets go in .env, not here.

storage:
  data_dir: ./data
  db_path: ./data/jobs.db

meshy:
  base_url: https://api.meshy.ai
  api_version: v2
  image_ai_model: meshy-6     # Meshy가 모델 deprecate하면 여기만 수정
  request_timeout_sec: 60
  poll_interval_sec: 5
  poll_max_minutes: 15
  max_concurrent_tasks: 2
  retry:
    max_attempts: 1            # 실패 시 1회만 재시도 (크레딧 절약)
    backoff_initial_sec: 2

pipeline:
  human_review_gate: true      # Meshy 생성 후 사람 승인 단계 사용
  auto_repair: true            # trimesh 자동 mesh 리페어
  strict_mesh_check: false     # true=non-watertight 거부, false=경고 후 슬라이서로
  target_size_mm: 80           # 모델 최대치수 스케일 목표 (256mm 빌드볼륨 내, 출력시간 합리)
  default_material: pla
  default_quality: standard

routing:
  # 모델 크기·재질 → 어느 프린터로 보낼지 결정
  rules:
    - if: { material: [abs, asa, petg] }
      use: p2s
    - default: a1            # 기본 A1 (P2S는 명시 선택 또는 ABS/ASA/PETG시)
