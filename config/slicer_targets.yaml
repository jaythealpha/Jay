# 슬라이서 프로파일 빌드 대상. 프린터 모델 추가 = 여기 블록 추가만 하면 됨.
# 각 값은 OrcaSlicer 번들 시스템 프리셋의 정확한 'name'.
# (scripts/inspect_orca.py 로 사용 가능한 name 확인 가능)

targets:
  p2s_pla_standard:
    machine: "Bambu Lab P2S 0.4 nozzle"
    process: "0.20mm Standard @BBL P2S"
    filament: "Bambu PLA Basic @BBL P2S"
  a1_pla_standard:
    machine: "Bambu Lab A1 0.4 nozzle"
    process: "0.20mm Standard @BBL A1"
    filament: "Bambu PLA Basic @BBL A1"

  # 추가 모델 예시 (필요 시 주석 해제 — 시스템 프리셋 존재 시 자동 생성)
  p1s_pla_standard:
    machine: "Bambu Lab P1S 0.4 nozzle"
    process: "0.20mm Standard @BBL P1P"
    filament: "Bambu PLA Basic @BBL P1S"
  x1c_pla_standard:
    machine: "Bambu Lab X1C 0.4 nozzle"
    process: "0.20mm Standard @BBL X1C"
    filament: "Bambu PLA Basic @BBL X1C"
  a1_silk_standard:
    machine: "Bambu Lab A1 0.4 nozzle"
    process: "0.20mm Standard @BBL A1"
    filament: "Bambu PLA Silk @BBL A1"
