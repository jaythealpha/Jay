[project]
name = "bambu-auto"
version = "0.1.0"
description = "Bambu Lab 3D print productization pipeline: source -> Meshy -> slice -> print"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "trimesh[easy]>=4.4",
    "numpy>=1.26",
    "manifold3d>=2.5",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "rembg>=2.0",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
printer = [
    "bambulabs-api>=2.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bambu-auto = "bambu_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_auto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
