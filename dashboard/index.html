<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude 작업 대시보드</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <div>
          <h1>Claude 작업 대시보드</h1>
          <p class="brand-sub">이 세션에서 생성된 작업 산출물을 한 곳에서 보고 실행합니다.</p>
        </div>
      </div>
      <div id="stats" class="stats" aria-label="요약 통계"></div>
    </div>
  </header>

  <section class="controls">
    <input id="search" type="search" placeholder="제목 · 태그 · 분류로 검색…" aria-label="작업 검색" />
    <div id="category-chips" class="chips" role="tablist" aria-label="분류 필터"></div>
    <div class="status-toggle">
      <label><input type="checkbox" id="show-done" checked /> 완료</label>
      <label><input type="checkbox" id="show-progress" checked /> 진행 중</label>
      <label><input type="checkbox" id="show-draft" checked /> 초안</label>
    </div>
  </section>

  <main id="card-grid" class="card-grid" aria-live="polite"></main>

  <div id="detail" class="detail" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <div class="detail-backdrop" data-close></div>
    <article class="detail-panel" role="document">
      <header class="detail-header">
        <div>
          <div id="detail-category" class="detail-category"></div>
          <h2 id="detail-title"></h2>
          <p id="detail-summary" class="detail-summary"></p>
        </div>
        <button class="icon-btn" data-close aria-label="닫기">✕</button>
      </header>
      <nav id="detail-actions" class="detail-actions"></nav>
      <div id="detail-meta" class="detail-meta"></div>
      <div id="detail-body" class="detail-body"></div>
    </article>
  </div>

  <footer class="footer">
    <small>
      대시보드는 정적 페이지입니다. <code>python3 -m http.server</code> 등으로 실행 후
      <code>http://localhost:8000/dashboard/</code> 로 접속하세요.
    </small>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
